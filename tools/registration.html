<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Windgrade — overlay registration test</title>
<style>
/* body stays unpainted: XCTrack renders white/absent as transparent so the
   widget floats over its map. Every control carries its own background. */
html,body{margin:0;padding:0;background:transparent;height:100%;overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;left:0;top:0;width:100%;height:100%}
#ui{position:absolute;left:0;top:0;right:0;font:600 11px/1.25 ui-monospace,"Roboto Mono",monospace}
.bar{display:block;padding:3px 5px;background:rgba(10,17,22,.82);color:#E8F0F5}
#badge{font-size:13px;letter-spacing:.04em}
#badge b{color:#54A6DC}
#diag{font-weight:400;font-size:10px;color:#9DB2C0;white-space:pre-wrap}
#btns{position:absolute;right:4px;bottom:4px;text-align:right}
#btns button{
  display:inline-block;min-width:34px;margin:2px;padding:7px 8px;
  background:rgba(29,43,54,.92);border:1px solid #2A3B48;border-radius:3px;
  color:#E8F0F5;font:600 12px ui-monospace,monospace;
}
#btns button:active{background:#28536E}
#btns .on{border-color:#54A6DC;color:#54A6DC}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <span class="bar" id="badge"></span>
  <span class="bar" id="diag"></span>
</div>
<div id="btns">
  <button id="bZo">z-</button><button id="bZi">z+</button><br>
  <button id="bMul">x1</button><br>
  <button id="bAs">AS</button><button id="bAlt">ALT</button><button id="bGr">GR</button>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   Overlay registration test — Phase 3b feasibility.

   Stack this WebView widget ON TOP of an XCTrack map widget covering the
   exact same area, both with rotation set to North-up. Set XCTrack's map
   scale to the value the badge names for the current zoom.

   Three independent checks, none relying on coordinates typed from memory:

     1. CENTRE  — the magenta cross must sit exactly under XCTrack's own
                  aircraft symbol. Tests centring, nothing else.
     2. SCALE   — the range rings are true ground distances. Compare against
                  XCTrack's own scale bar.
     3. FULL    — airspace outlines come from SHV, the same data XCTrack
                  draws. Toggle XCTrack's airspace layer and see whether the
                  edges coincide. This is the real test (chmd's method,
                  gitlab xcontest-public/xctrack-public#1235).

   If alignment needs the x-multiplier at x3, XCTrack's scale is in device
   pixels, not CSS pixels. If a different integer zoom lines up, the issue
   table is wrong for this build. Either answer is a result — report it.

   Settings this needs in XCTrack: "Allow web page to access XCTrack data"
   ON, refresh rate 0, and "Allow tapping on the web page when locked" ON
   for the buttons.
   ══════════════════════════════════════════════════════════════ */

/* ── scale ↔ OSM zoom ────────────────────────────────────────────────
   chmd's table in xctrack-public#1235 lists labels this build does not
   have. Their OSM-aligned steps were 400m/800m/1500m/3km/6km/12km/25km/
   50km/100km/200km/400km; the owner's slider offers 23 values —  exactly
   chmd's mapWidget_scale.value span of 12..34 — of which every second one
   doubles. Taking the alternating subset that lines up position-for-
   position gives a consistent ~1.25x relabel:

     z15 500m   z14 1km    z13 2km    z12 4km   z11 8km   z10 15km
     z9  30km   z8  60km   z7  120km  z6  250km z5  500km

   So this build's "8 km" should be chmd's "6 km", i.e. OSM z11. The other
   alternating subset (300m/600m/1.2km/2.5km/5km/10km/20km/40km/80km/
   150km/300km/600km) sits half a zoom level away and cannot land on an
   integer OSM zoom — which is why 5 km and 10 km are the wrong ones to
   calibrate with even though they look like round numbers.

   All of this is a hypothesis. The buttons are here to test it, and the
   sqrt2 multipliers exist in case the other subset turns out to be the
   aligned one after all. ──────────────────────────────────────────── */
var SCALE_LABEL = {5:"500km",6:"250km",7:"120km",8:"60km",9:"30km",
                   10:"15km",11:"8km",12:"4km",13:"2km",14:"1km",15:"500m"};
var MULTS = [1, 1.414, 0.707, 2, 0.5, 1.5, 0.667, 3];
var AIRSPACE_URL = "https://airspace.shv-fsvl.ch/api/v2/geojson/airspaces";
var LS_KEY = "wg.reg.lastfix";
var DPR_CAP = 2;          /* AGENTS.md: cap the backing store at 1-2 */
var POLL_MS = 500;        /* match XCTrack's 2 Hz map redraw */
var RINGS_KM = [5, 10, 20, 40];

var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var zoom = 11, muli = 0, showAS = true, showGR = true, showALT = true;
var asDrawn = 0;
var W = 0, H = 0, dpr = 1;
var fix = null, fixSrc = "none", rawLoc = "";
var as = null, asState = "loading…";
var lastKey = "";

/* ── guarded localStorage (hx-call pattern) ───────────────────────── */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

/* ── Web Mercator. World is 256*2^z px; we work in CSS px. ────────── */
function lon2px(lon,z){ return (lon+180)/360*256*Math.pow(2,z); }
function lat2px(lat,z){
  var s = Math.sin(lat*Math.PI/180);
  if (s >  0.9999) s =  0.9999;
  if (s < -0.9999) s = -0.9999;
  return (0.5 - Math.log((1+s)/(1-s))/(4*Math.PI))*256*Math.pow(2,z);
}
function mpp(lat,z){ return 156543.034*Math.cos(lat*Math.PI/180)/Math.pow(2,z); }

/* ── position chain: XCTrack -> URL params -> geolocation -> stored ── */
function qs(n){
  var m = new RegExp("[?&]"+n+"=([^&]*)").exec(location.search);
  return m ? decodeURIComponent(m[1]) : null;
}
/* An unsubstituted placeholder arrives as the literal "${lat}" and must be
   ignored, not parsed — hx-call records this exact failure. */
function num(v){
  if (v === null) return NaN;
  if (/\$\{/.test(v)) return NaN;
  var f = parseFloat(v);
  return isFinite(f) ? f : NaN;
}

function readXCTrack(){
  var raw = null;
  try {
    if (typeof XCTrack === "undefined" || typeof XCTrack.getLocation !== "function") return null;
    raw = XCTrack.getLocation();
  } catch(e){ rawLoc = "threw: " + e.message; return null; }
  rawLoc = String(raw).slice(0,120);
  if (raw === null || raw === "null") return null;
  var o;
  try { o = (typeof raw === "string") ? JSON.parse(raw) : raw; } catch(e){ return null; }
  if (!o || typeof o !== "object") return null;
  if (!isFinite(o.lat) || !isFinite(o.lon)) return null;
  return { lat:o.lat, lon:o.lon, alt:o.altGps, baro:o.stdBaroAlt,
           hdg:o.heading, brg:o.bearingGps, valid:o.isValid };
}

function acquire(){
  var x = readXCTrack();
  if (x){ fix = x; fixSrc = "xctrack"; remember(); return; }
  var la = num(qs("lat")), lo = num(qs("lng"));
  if (isNaN(lo)) lo = num(qs("lon"));
  if (!isNaN(la) && !isNaN(lo)){
    fix = {lat:la, lon:lo}; fixSrc = "url"; remember(); return;
  }
  if (fix && fixSrc !== "stored") return;      /* keep geolocation's fix */
  var s = lsGet(LS_KEY);
  if (s){
    var p = s.split(",");
    if (p.length >= 2 && isFinite(+p[0]) && isFinite(+p[1])){
      fix = {lat:+p[0], lon:+p[1]}; fixSrc = "stored";
    }
  }
}
function remember(){
  if (fix) lsSet(LS_KEY, fix.lat.toFixed(6)+","+fix.lon.toFixed(6));
}
if (navigator.geolocation){
  navigator.geolocation.watchPosition(function(p){
    if (fixSrc === "xctrack" || fixSrc === "url") return;
    fix = {lat:p.coords.latitude, lon:p.coords.longitude, alt:p.coords.altitude};
    fixSrc = "geo"; remember();
  }, function(){}, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}

/* ── airspace ─────────────────────────────────────────────────────────
   XCTrack filters its airspace display to the ACTIVE ones whose floor is
   below (my altitude + 600 m), and applies no filter at all without GPS.
   We mirror that, or the overlay would draw dozens of polygons XCTrack is
   deliberately hiding and the comparison would be unreadable.

   SHV gives a structured floor: Lower.Metric.Alt.{Type, Altitude}, where
   Type is "m AGL", "m QNH" or "m STD". QNH and STD are close enough to MSL
   for a calibration filter. AGL is terrain-relative and we ship no DEM, so
   treat it as 0 — 179 of 359 features are "0 m AGL" anyway, i.e. from the
   ground up, which is always below the pilot.

   InactiveByAgreement is excluded as "not active". HX and DABS activation
   we cannot know from here, so those may still differ from XCTrack. ────── */
function lowerMetres(p){
  try {
    var a = p.Lower.Metric.Alt;
    if (/AGL/.test(a.Type)) return 0;
    return +a.Altitude;
  } catch(e){ return 0; }
}

function loadAirspace(){
  if (!window.fetch){ asState = "no fetch"; return; }
  fetch(AIRSPACE_URL).then(function(r){
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    var f = (j && j.features) || [], out = [], i, k, g, rings;
    for (i = 0; i < f.length; i++){
      g = f[i].geometry; if (!g) continue;
      rings = (g.type === "Polygon") ? g.coordinates
            : (g.type === "MultiPolygon") ? [].concat.apply([], g.coordinates) : null;
      if (!rings) continue;
      for (k = 0; k < rings.length; k++){
        var r2 = rings[k], j2, mnx=180, mny=90, mxx=-180, mxy=-90;
        if (!r2 || r2.length < 3) continue;
        for (j2 = 0; j2 < r2.length; j2++){
          var c = r2[j2];
          if (c[0] < mnx) mnx = c[0]; if (c[0] > mxx) mxx = c[0];
          if (c[1] < mny) mny = c[1]; if (c[1] > mxy) mxy = c[1];
        }
        var pr = f[i].properties || {};
        out.push({ pts:r2, mnx:mnx, mny:mny, mxx:mxx, mxy:mxy,
                   hx: !!pr.HX, lo: lowerMetres(pr),
                   inact: !!pr.InactiveByAgreement });
      }
    }
    as = out; asState = out.length + " rings";
    lastKey = ""; draw();
  }).catch(function(e){ asState = "failed: " + e.message; lastKey = ""; draw(); });
}
loadAirspace();

/* ── sizing ───────────────────────────────────────────────────────── */
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  lastKey = "";
}
window.addEventListener("resize", resize);

/* ── draw ─────────────────────────────────────────────────────────── */
function draw(){
  ctx.clearRect(0,0,W,H);
  if (!fix){ paintUI(); return; }

  var mul = MULTS[muli];
  var cx = lon2px(fix.lon, zoom), cy = lat2px(fix.lat, zoom);
  var res = mpp(fix.lat, zoom) / mul;         /* effective metres per CSS px */
  function sx(lon){ return (lon2px(lon,zoom)-cx)*mul + W/2; }
  function sy(lat){ return (lat2px(lat,zoom)-cy)*mul + H/2; }

  /* 3. airspace — the real reference */
  if (showAS && as){
    var vw = (W/2)*res/111320, vh = (H/2)*res/111320;   /* deg padding, rough */
    var padx = vw/Math.cos(fix.lat*Math.PI/180) + 0.05, pady = vh + 0.05;
    var w0 = fix.lon-padx, w1 = fix.lon+padx, s0 = fix.lat-pady, s1 = fix.lat+pady;
    ctx.lineWidth = 1;
    /* mirror XCTrack: active only, floor below alt+600. No altitude -> no
       filter, which is also what XCTrack does with GPS blocked. */
    var ceil = (showALT && fix.alt !== undefined && fix.alt !== null && isFinite(fix.alt))
             ? fix.alt + 600 : null;
    asDrawn = 0;
    for (var i = 0; i < as.length; i++){
      var r = as[i];
      if (r.mxx < w0 || r.mnx > w1 || r.mxy < s0 || r.mny > s1) continue;
      if (ceil !== null && (r.inact || r.lo > ceil)) continue;
      asDrawn++;
      ctx.strokeStyle = r.hx ? "rgba(233,163,60,.95)" : "rgba(84,166,220,.85)";
      ctx.beginPath();
      for (var j = 0; j < r.pts.length; j++){
        var p = r.pts[j], X = sx(p[0]), Y = sy(p[1]);
        if (j === 0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
      }
      ctx.closePath(); ctx.stroke();
    }
  }

  /* 2. range rings — compare against XCTrack's scale bar */
  ctx.strokeStyle = "rgba(232,240,245,.55)";
  ctx.fillStyle   = "rgba(232,240,245,.9)";
  ctx.font = "10px ui-monospace,monospace";
  ctx.lineWidth = 1;
  for (var k = 0; k < RINGS_KM.length; k++){
    var rad = RINGS_KM[k]*1000/res;
    if (rad < 12 || rad > Math.max(W,H)) continue;
    ctx.beginPath(); ctx.arc(W/2, H/2, rad, 0, Math.PI*2); ctx.stroke();
    ctx.fillText(RINGS_KM[k]+"km", W/2 + 3, H/2 - rad + 11);
  }

  /* graticule at a spacing that yields a few lines */
  if (showGR){
    var stepChoices = [10,5,2,1,.5,.2,.1,.05,.02,.01], step = .1, want = W*res/111320/4;
    for (var q = 0; q < stepChoices.length; q++){
      if (stepChoices[q] <= want){ step = stepChoices[q]; break; }
    }
    ctx.strokeStyle = "rgba(123,144,159,.35)"; ctx.lineWidth = 1;
    var lo0 = Math.floor((fix.lon - padDeg(W,res,fix.lat))/step)*step;
    var lo1 = fix.lon + padDeg(W,res,fix.lat);
    for (var g = lo0; g <= lo1; g += step){
      var X2 = sx(g);
      ctx.beginPath(); ctx.moveTo(X2,0); ctx.lineTo(X2,H); ctx.stroke();
    }
    var la0 = Math.floor((fix.lat - (H/2)*res/111320)/step)*step;
    var la1 = fix.lat + (H/2)*res/111320;
    for (var g2 = la0; g2 <= la1; g2 += step){
      var Y2 = sy(g2);
      ctx.beginPath(); ctx.moveTo(0,Y2); ctx.lineTo(W,Y2); ctx.stroke();
    }
  }

  /* 1. centre cross — must sit under XCTrack's aircraft symbol */
  var mx = W/2, my = H/2;
  ctx.strokeStyle = "#FF2FB0"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mx-16,my); ctx.lineTo(mx+16,my);
  ctx.moveTo(mx,my-16); ctx.lineTo(mx,my+16);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(mx,my,5,0,Math.PI*2); ctx.stroke();

  paintUI();
}
function padDeg(px,res,lat){ return (px/2)*res/111320/Math.cos(lat*Math.PI/180); }

/* ── UI text, written only when it changed ────────────────────────── */
var elBadge = document.getElementById("badge"), elDiag = document.getElementById("diag");
var lastBadge = "", lastDiag = "";
function paintUI(){
  var mul = MULTS[muli];
  var b = "z" + zoom + " ≙ XCT " + (SCALE_LABEL[zoom] || "?") +
          "  ×" + mul + "  N↑";
  if (b !== lastBadge){ elBadge.innerHTML = ""; elBadge.appendChild(document.createTextNode(b)); lastBadge = b; }

  var d;
  if (!fix){
    d = "no position yet  ·  src=" + fixSrc + "  ·  XCTrack=" + (rawLoc || "n/a");
  } else {
    var res = mpp(fix.lat, zoom)/mul;
    d = "src=" + fixSrc + "  " + fix.lat.toFixed(5) + "," + fix.lon.toFixed(5) +
        (fix.valid === undefined ? "" : "  valid=" + fix.valid) + "\n" +
        "altGps=" + fmt(fix.alt) + "  stdBaroAlt=" + fmt(fix.baro) +
        "  hdg=" + fmt(fix.hdg) + "  brgGps=" + fmt(fix.brg) + "\n" +
        res.toFixed(2) + " m/px  view " + W + "×" + H + " css  dpr" +
        (window.devicePixelRatio||1) + "→" + dpr + "  " +
        (W*res/1000).toFixed(1) + "×" + (H*res/1000).toFixed(1) + " km\n" +
        "airspace " + asState + "  drawn=" + asDrawn + "  filter=" +
        (!showALT ? "off" : (fix.alt === undefined || fix.alt === null || !isFinite(fix.alt))
                            ? "off (no alt)" : "<" + Math.round(fix.alt+600) + "m");
  }
  if (d !== lastDiag){ elDiag.innerHTML = ""; elDiag.appendChild(document.createTextNode(d)); lastDiag = d; }
}
function fmt(v){ return (v === undefined || v === null || v !== v) ? "—" : (Math.round(v*10)/10); }

/* ── poll: 2 Hz, but redraw only when something moved a whole pixel ─ */
function tick(){
  acquire();
  var key = "none";
  if (fix){
    var mul = MULTS[muli];
    key = Math.round(lon2px(fix.lon,zoom)*mul) + "/" + Math.round(lat2px(fix.lat,zoom)*mul) +
          "/" + zoom + "/" + muli + "/" + (showAS?1:0) + (showGR?1:0) + (showALT?1:0) +
          "/" + Math.round((fix.alt||0)/50) + "/" + W + "x" + H;
  }
  if (key !== lastKey){ lastKey = key; draw(); }
  else paintUI();
}

/* ── controls ─────────────────────────────────────────────────────── */
function bind(id, fn){
  document.getElementById(id).addEventListener("click", function(){
    fn(); lastKey = ""; syncBtns(); draw();
  });
}
bind("bZi", function(){ if (zoom < 15) zoom++; });
bind("bZo", function(){ if (zoom > 5)  zoom--; });
bind("bMul", function(){ muli = (muli+1) % MULTS.length; });
bind("bAs", function(){ showAS = !showAS; });
bind("bAlt", function(){ showALT = !showALT; });
bind("bGr", function(){ showGR = !showGR; });
function syncBtns(){
  document.getElementById("bMul").firstChild.nodeValue = "x" + MULTS[muli];
  document.getElementById("bAs").className  = showAS  ? "on" : "";
  document.getElementById("bAlt").className = showALT ? "on" : "";
  document.getElementById("bGr").className  = showGR  ? "on" : "";
}

resize(); syncBtns(); tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
