<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1116">
<title>Windgrade — nearby wind stations</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="wg/base.css">
<style>
/* Data first. Settings live in a collapsed sheet pinned to the bottom, so a
   pilot scanning readings never scrolls past a form to reach them. */
body{padding:8px 8px calc(58px * var(--scale))}
h1{font-size:.86em;letter-spacing:.1em;text-transform:uppercase;margin:0 0 2px;color:var(--dim)}
#hdr{font-family:var(--mono);font-size:.78em;color:var(--dim);margin:0 0 8px;white-space:pre-wrap}
#err{margin:6px 0;padding:8px;border-radius:3px;font-size:.84em;
  background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber)}
.bar{display:flex;gap:6px;margin:0 0 8px}
.bar button,.bar a{flex:1;padding:9px;background:var(--panel-hi);border:1px solid var(--rule);
  border-radius:3px;color:var(--fg);font:600 .84em var(--sans);text-align:center;
  text-decoration:none}

/* chip: marker, then numbers, then facts. The number is never optional. */
.chip{display:flex;align-items:center;gap:9px;padding:7px 8px;margin:0 0 5px;
  background:var(--panel);border:1px solid var(--rule);border-radius:4px;
  box-shadow:var(--shadow)}
.chip.stale{border-color:var(--red);background:var(--stale-bg)}
.chip.warn{border-color:var(--warn-line)}
.mk{flex:none;width:calc(44px * var(--scale));height:calc(44px * var(--scale))}
.num{flex:none;min-width:calc(84px * var(--scale));font-family:var(--mono);font-weight:700;
  font-size:1.22em;letter-spacing:-.02em;text-align:right}
.num small{display:block;font-size:.52em;font-weight:400;color:var(--dim);letter-spacing:.06em}
.meta{flex:1 1 auto;min-width:0}
.nm{font-weight:600;font-size:.94em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-family:var(--mono);font-size:.72em;color:var(--dim);margin-top:2px;
  overflow-wrap:anywhere}
.age.warn{color:var(--amber)} .age.stale{color:var(--red);font-weight:700}
.pk{color:var(--chart)}
.st-orange{color:var(--amber)} .st-red{color:var(--red)}

footer{margin-top:14px;padding-top:8px;border-top:1px solid var(--rule);
  font-size:.72em;line-height:1.55;color:var(--dim)}

/* ── settings sheet ─────────────────────────────────────────────── */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;
  background:var(--panel);border-top:1px solid var(--rule);z-index:5}
#sheet > summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:12px;font:600 .8em var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim)}
#sheet > summary::-webkit-details-marker{display:none}
#sheet > summary::after{content:"▲";margin-left:auto;font-size:.8em}
#sheet[open] > summary::after{content:"▼"}
#sheet .inner{padding:0 12px}
.sheetfoot{display:flex;gap:8px;padding:12px}
.sheetfoot button,.sheetfoot a{flex:1;padding:10px;background:var(--panel-hi);
  border:1px solid var(--rule);border-radius:3px;color:var(--fg);
  font:600 .84em var(--sans);text-align:center;text-decoration:none}

.bar button:active,.bar a:active,.sheetfoot button:active,.sheetfoot a:active{
  background:var(--rule)}
@media (hover:hover) and (pointer:fine){
  .bar button,.bar a,.sheetfoot button,.sheetfoot a{transition:border-color .12s}
  .bar button:hover,.bar a:hover,.sheetfoot button:hover,.sheetfoot a:hover{
    border-color:var(--chart)}
  #sheet > summary:hover{color:var(--fg)}
}
</style>
</head>
<body>

<h1>Windgrade</h1>
<div id="hdr">starting…</div>
<div id="err" hidden></div>
<div class="bar">
  <button id="bRef" type="button">Refresh</button>
  <a href="index.html">Setup &amp; widget</a>
</div>
<div id="list"></div>

<footer id="foot"></footer>

<details id="sheet">
  <summary>Settings</summary>
  <div class="inner" id="fields"></div>
  <div class="sheetfoot">
    <button id="reset" type="button">Reset</button>
    <a href="index.html">Build a widget URL</a>
  </div>
</details>

<script src="wg/core.js"></script>
<script src="wg/marker.js"></script>
<script src="wg/windsmobi.js"></script>
<script src="wg/fields.js"></script>
<script src="wg/offline.js"></script>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   app.html — the standalone list. Phase 2: data, no map.

   Useful on its own, and the place the rating scale gets judged. Renders the
   real marker geometry, so the colours can be evaluated without XCTrack.

   Installable: it keeps its settings in localStorage and its shell in a
   service worker. The SHELL only — readings are never cached, because old
   wind shown confidently is the one way this could hurt someone. See sw.js.

   Rows are built once and only changed text nodes are rewritten, so a
   stationary pilot with unchanged readings causes no DOM writes.
   ═══════════════════════════════════════════════════════════════════ */

/* Stored settings, then the URL on top: a shared link means what it says. */
var C = WG.initConfig(location.search, { store: true });
var PROV = WG.providers.windsmobi;
var VIEW_W = 448, VIEW_H = 978;      /* nominal widget, for the fetch bbox */
var stations = [], lastFetch = 0, lastErr = "", fetching = false, meta1 = "";
var rows = {};                        /* id -> {el, cache} */

function el(id){ return document.getElementById(id); }

/* Only the scale labels need this here, but the engine is shared and one page
   silently disagreeing with the other is exactly what drifts. */
WG.setDpr(window.devicePixelRatio || WG.DPR_REF);
WG.applyTheme();

/* ── position: browser geolocation on a laptop, XCTrack on the phone ── */
if (navigator.geolocation){
  navigator.geolocation.watchPosition(function(p){
    WG.setGeoFix({ lat:p.coords.latitude, lon:p.coords.longitude,
                   alt:p.coords.altitude, src:"geo", valid:true });
    tick();
  }, function(e){ note("Location unavailable: " + e.message +
                       " — or open with ?lat=47.05&lng=8.64"); },
     { enableHighAccuracy:true, maximumAge:10000, timeout:20000 });
}

function note(s){ lastErr = s; paintErr(); }
function paintErr(){
  var e = el("err");
  e.hidden = !lastErr;
  if (lastErr) e.textContent = lastErr;
}

/* Shared with the overlay widget, so the two renderings cannot drift. */
function marker(st){ return WG.marker.svg(st, null, { cls: "mk" }); }

/* ── rows ─────────────────────────────────────────────────────────── */
function buildRow(st){
  var d = document.createElement("div");
  d.className = "chip";
  d.innerHTML = marker(st) +
    '<div class="num"><span></span><small></small></div>' +
    '<div class="meta"><div class="nm"></div><div class="sub"></div></div>';
  return { el:d, cache:{} };
}
function mkNode(st){
  var wrap = document.createElement("div");
  wrap.innerHTML = marker(st);
  return wrap.firstChild;
}

function paintRow(r, st){
  var c = r.cache;

  var key = st.rAvg + "/" + st.rGust + "/" + (st.dir | 0) + "/" + st.avg + "/" + st.gust;
  if (c.mk !== key){ r.el.replaceChild(mkNode(st), r.el.firstChild); c.mk = key; }

  var num = WG.marker.labelText(st);
  if (c.num !== num){ r.el.querySelector(".num span").textContent = num; c.num = num; }

  var unit = "km/h" + ((st.dir === st.dir) ? " · " + Math.round(st.dir) + "°" : "");
  if (c.unit !== unit){ r.el.querySelector(".num small").textContent = unit; c.unit = unit; }

  var nm = st.name + (st.peak ? "|peak" : "");
  if (c.nm !== nm){
    var nmEl = r.el.querySelector(".nm");
    nmEl.textContent = "";
    nmEl.appendChild(document.createTextNode(st.name + " "));
    if (st.peak){
      var p = document.createElement("span");
      p.className = "pk"; p.textContent = "▲"; p.title = "on a summit";
      nmEl.appendChild(p);
    }
    c.nm = nm;
  }

  var head = (isFinite(st.alt) ? Math.round(st.alt) + " m · " : "") +
             (Math.round(st.dist / 100) / 10) + " km " + compass(st.brg) + " · ";
  var sk = head + "|" + st.stale.cls + "|" + Math.round(st.stale.age) + "|" + st.status;
  if (c.sub !== sk){
    var subEl = r.el.querySelector(".sub");
    subEl.textContent = "";
    subEl.appendChild(document.createTextNode(head));
    /* Age before the attribution: it is the field that decides whether the
       reading can be trusted, and it must not be what wraps off the line. */
    var ag = document.createElement("span");
    ag.className = "age " + st.stale.cls;
    ag.textContent = (st.stale.age === st.stale.age)
      ? Math.round(st.stale.age) + " min" : "no timestamp";
    subEl.appendChild(ag);
    subEl.appendChild(document.createTextNode(" · " + st.provider));
    if (st.status === "orange" || st.status === "red"){
      var s2 = document.createElement("span");
      s2.className = "st-" + st.status;
      s2.textContent = "  station " + st.status;
      subEl.appendChild(s2);
    }
    c.sub = sk;
  }

  var cls = "chip" + (st.stale.cls === "fresh" ? "" : " " + st.stale.cls);
  if (r.el.className !== cls) r.el.className = cls;
}

function compass(b){
  if (b !== b) return "";
  var n = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return n[Math.round(b / 22.5) % 16];
}

/* ── render ───────────────────────────────────────────────────────── */
function render(fix){
  var list = el("list"), i, st, r, seen = {}, id;
  var ranked = WG.prepare(stations, fix, C, Date.now());

  for (i = 0; i < ranked.length; i++){
    st = ranked[i]; seen[st.id] = 1;
    r = rows[st.id] || (rows[st.id] = buildRow(st));
    paintRow(r, st);
    if (list.childNodes[i] !== r.el) list.insertBefore(r.el, list.childNodes[i] || null);
  }
  for (id in rows){
    if (rows.hasOwnProperty(id) && !seen[id]){
      if (rows[id].el.parentNode) rows[id].el.parentNode.removeChild(rows[id].el);
      delete rows[id];
    }
  }

  var nets = WG.attribution(ranked), f = el("foot");
  f.textContent =
    "Sources: " + (nets.length ? nets.join(", ") : "—") + ", aggregated by winds.mobi. " +
    "Measured values only — station altitude, speed, gust, direction. No " +
    "interpolation between stations and no lee-side inference. The colour scale " +
    "is a rough aid, NOT an assessment of whether a flight is safe. Readings " +
    "cannot work offline; anything marked stale is old and must be treated as " +
    "unknown.";
}

/* ── fetch ────────────────────────────────────────────────────────── */
function refresh(fix){
  if (fetching || !fix) return;
  fetching = true;
  var bbox = WG.bboxAround(fix, WG.zoomOf(C), VIEW_W, VIEW_H, C.pad);
  PROV.fetchBBox(bbox, { maxAgeSec: C.stale * 60 * 4, limit: 500 }, function (err, list, meta){
    fetching = false;
    if (err) note("Fetch failed: " + err + " — showing the last good data, if any.");
    else {
      lastErr = ""; paintErr();
      stations = list; lastFetch = Date.now();
      meta1 = (meta.bytes / 1024).toFixed(1) + " KB · " + meta.ms + " ms";
    }
    tick();
  });
}

/* ── tick ─────────────────────────────────────────────────────────── */
function tick(){
  var p = WG.position(C), fix = p.fix;
  if (!fix){
    el("hdr").textContent = "No position yet. Allow location, or open with " +
                            "?lat=47.05&lng=8.64\nXCTrack: " + p.note;
    return;
  }
  if (!lastFetch || Date.now() - lastFetch > C.poll * 1000) refresh(fix);

  el("hdr").textContent =
    "src=" + fix.src + "  " + fix.lat.toFixed(5) + "," + fix.lon.toFixed(5) +
    (isFinite(fix.alt) ? "  " + Math.round(fix.alt) + " m" : "") + "\n" +
    "scale " + WG.scaleLabel(C.step, fix.lat, C.wpx) + " ≙ z" + WG.zoomOf(C).toFixed(1) +
    (meta1 ? "  ·  " + meta1 : "") +
    (lastFetch ? "  ·  " + Math.round((Date.now() - lastFetch) / 1000) + " s ago" : "") +
    "  ·  " + stations.length + " stations";

  render(fix);
}

/* ── settings sheet, generated from WG.SPEC so it can never drift ──
   Zoom and the fetch margin change WHAT to fetch, so any change forces a
   refetch; the rest only affect rendering, but one path is simpler than
   two and a refetch costs one ~18 KB call. */
var fields = WG.fields(el("fields"), {
  skipWidgetOnly: true,
  onChange: function(){
    dropRows();
    lastFetch = 0;
    tick();
  }
});
function dropRows(){
  for (var id in rows) if (rows.hasOwnProperty(id)){
    if (rows[id].el.parentNode) rows[id].el.parentNode.removeChild(rows[id].el);
    delete rows[id];
  }
}

el("reset").addEventListener("click", function(){
  WG.resetConfig();
  C = WG.getConfig();
  WG.applyTheme();
  fields.reload();
  dropRows();
  lastFetch = 0;
  tick();
});
el("bRef").addEventListener("click", function(){ lastFetch = 0; tick(); });

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
