<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Windgrade widget</title>
<style>
/* The body stays UNPAINTED. XCTrack renders white or absent as transparent,
   which is what lets this float over its map. Never add a background. */
html,body{margin:0;padding:0;background:transparent;height:100%;overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* The browser applies `hidden` as a low-priority [hidden]{display:none}. Any
   author rule that sets display — #zbtns{display:flex} did — silently outranks
   it and the element stays on screen. base.css restates this for the other
   pages; this one cannot load base.css, because its body must stay unpainted,
   so it needs its own copy. Without it the zoom buttons rendered with zbtn=0,
   landed top-left for want of a position class, and did nothing because their
   handlers are only bound when the feature is on. */
[hidden]{display:none !important}
#cv{position:absolute;left:0;top:0;width:100%;height:100%}
/* The badge carries its own background; nothing else does. */
#badge{position:absolute;left:0;top:0;z-index:10;padding:2px 5px;
  background:rgba(10,17,22,.78);color:#E8F0F5;
  font:600 11px/1.25 ui-monospace,"Roboto Mono",monospace;white-space:pre}
#badge.bad{background:rgba(126,26,20,.92)}
/* A compact chip sitting directly ABOVE our scale bar, pointing at it. A
   full-width bar here covered XCTrack's own scale, which is the one thing the
   pilot has to compare against — it made itself pointless. Transient: it is a
   prompt, not a state, and the state lives on in the amber bar number. */
#warn{position:absolute;z-index:6;white-space:nowrap;
  padding:7px 10px;background:rgba(150,105,15,.95);color:#FFF6E6;border-radius:3px;
  font:700 12px/1.15 ui-monospace,"Roboto Mono",monospace;
  opacity:1;transition:opacity .5s}
#warn.fade{opacity:0;pointer-events:none}
/* Only present when ztap=1. Invisible: they exist to catch a tap, not to be
   looked at. Nothing else in this widget is a hit target, deliberately —
   with tapping enabled the WebView swallows every touch over its area, so a
   zone here is a zone taken away from XCTrack. */
.zone{position:absolute;left:0;width:100%;height:50%}
#zin{top:0} #zout{top:50%}

/* Dedicated zoom buttons. Small and cornered, so they cost little area — the
   invisible halves can stay on alongside them. */
/* Placement is the pilot's, because the widget shares its rectangle with
   XCTrack's own controls and only they know what is already there — including
   a second pair for the map's zoom, which is why the row layout exists. */
#zbtns{position:absolute;display:flex;flex-direction:column;gap:4px;
  padding:4px;z-index:7}
#zbtns.row{flex-direction:row}
#zbtns.p-bottom-right{right:0;bottom:0}
#zbtns.p-bottom-left{left:0;bottom:0}
#zbtns.p-top-right{right:0;top:0}
#zbtns.p-top-left{left:0;top:0}
#zbtns.p-top-centre{top:0;left:50%;transform:translateX(-50%)}
#zbtns.p-bottom-centre{bottom:0;left:50%;transform:translateX(-50%)}
#zbtns.p-left-centre{left:0;top:50%;transform:translateY(-50%)}
#zbtns.p-right-centre{right:0;top:50%;transform:translateY(-50%)}
#zbtns button{width:46px;height:46px;background:rgba(10,17,22,.82);color:#E8F0F5;
  border:1px solid #2A3B48;border-radius:4px;font:700 22px ui-monospace,monospace}

/* Detail popup. Carries its own background — the body must stay unpainted. */
#pop{position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:74%;overflow:auto;
  background:rgba(10,17,22,.96);border-top:1px solid #2A3B48;
  color:#E8F0F5;font:400 12px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:9px 10px 11px}
#pop h3{margin:0 0 1px;font-size:15px;font-weight:700}
#pop .sub{color:#7B909F;font:400 11px/1.35 ui-monospace,"Roboto Mono",monospace;margin:0 0 8px}
#pop .now{display:flex;gap:14px;align-items:baseline;margin:0 0 9px}
#pop .now b{font:700 26px ui-monospace,monospace;letter-spacing:-.02em}
#pop .now i{font-style:normal;color:#7B909F;font-size:11px}
/* Fixed height. The strip fills in a moment after the header, and without a
   reserved box the whole panel would resize as it arrives — which is what the
   flash on tapping a second marker actually was. */
#pop .trend{display:flex;gap:3px;overflow-x:auto;padding-bottom:2px;
  min-height:62px;align-items:center}
#pop .trend .wait{color:#7B909F;font:400 11px ui-monospace,monospace}
#pop .t{flex:none;width:44px;text-align:center}
#pop .t svg{display:block;width:34px;height:34px;margin:0 auto}
#pop .t em{display:block;font:700 11px ui-monospace,monospace;font-style:normal}
#pop .t span{display:block;color:#7B909F;font:400 9px ui-monospace,monospace}
#pop .src{color:#7B909F;font-size:10px;margin-top:8px;line-height:1.45}
/* Must out-specify "#pop .now i", which sets the muted colour. The age is the
   field that says whether the reading can be trusted; it has to carry its state. */
#pop .now i.stale, #pop .stale{color:#D6483C;font-weight:700}
#pop .now i.warn, #pop .warn{color:#E9A33C}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="zin" class="zone" hidden></div>
<div id="zout" class="zone" hidden></div>
<div id="zbtns" hidden><button id="bIn" type="button">+</button><button id="bOut" type="button">−</button></div>
<div id="warn" hidden>← match scale</div>
<div id="pop" hidden></div>
<div id="badge"></div>

<script src="wg/core.js"></script>
<script src="wg/marker.js"></script>
<script src="wg/windsmobi.js"></script>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   widget.html — Phase 3b. Arrows only, on a transparent page, stacked ON
   TOP of an XCTrack map widget covering the same rectangle.

   REQUIRED XCTrack SETUP
     XC map widget (below):  scale per the badge, rotation NORTH-UP
     This widget (above):    same rectangle, refresh rate 0,
                             "Allow web page to access XCTrack data" ON

   Refresh rate MUST be 0. With ${lat}/${lng} substitution XCTrack reloads
   the whole page on its refresh interval, which would bin the canvas, the
   station cache and any in-flight fetch every minute or two.

   The badge states the zoom and the XCTrack scale it pairs with, so a
   mis-paired map reads as a disagreement between two labels rather than as
   silent drift. Arrow POSITIONS are the only thing a mis-pairing breaks;
   numbers, colours and altitudes stay correct regardless.
   ═══════════════════════════════════════════════════════════════════ */

var C = WG.cfg(location.search);
var PROV = WG.providers.windsmobi;
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");

/* Double buffered. Markers are drawn into an offscreen canvas and blitted
   in ONE composite-copy operation, so the visible canvas is never caught
   cleared-but-not-yet-redrawn. That is a flicker risk at 2 Hz over a moving
   map, and it also made headless screenshots come out blank — the capture
   landed between the clear and the redraw. */
var buf = document.createElement("canvas"), bctx = buf.getContext("2d");

var W = 0, H = 0, dpr = 1;
/* The scale actually being drawn. Equals C.step until the pilot taps a zone;
   after that the widget CANNOT know whether the map followed, which is why the
   badge marks it and the scale bar exists. */
var curStep = C.step;
/* Right edge of the scale bar in css px, so the prompt can sit beside it. The
   bar's length changes with the scale, so this cannot be a constant. */
var barRight = 15;
/* Screen positions of the markers actually drawn, so a tap can be matched to a
   station. Rebuilt on every draw. */
var hits = [];
var popStation = null, popTimer = null, popHist = null, popErr = "";
/* id -> {at, list}. A re-tap inside the data's own cadence is answered from
   here, so it neither flashes nor spends a call. */
var histCache = {};
var stations = [], lastFetch = 0, fetchErr = "", fetching = false;
var drawKey = "", lastShown = 0;

/* ── sizing. Cap the backing store at DPR 2: the probe measured DPR 3, and
   full-DPR costs ~9x the fill rate for no legibility gain at 100 m/px. ── */
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = buf.width = Math.round(W * dpr);
  cv.height = buf.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawKey = "";
}
window.addEventListener("resize", resize);

/* Marker and label come from wg/marker.js, shared with app.html's SVG so the
   geometry, the band widths and the downwind rotation cannot drift between the
   two renderings. Extracted from this file because it was untestable here. */

/* ── draw ─────────────────────────────────────────────────────────────
   Declutter by collision, nearest first, evicting WHOLE markers. A number
   without its arrow has lost its direction; an arrow without its number has
   lost the reading. Either half alone is worse than omitting the station —
   see the SeeYou decluttering bug in handover.md. ──────────────────── */
function draw(fix, ranked){
  bctx.clearRect(0, 0, W, H);
  hits = [];
  var shown = 0;
  if (fix){
    var scale = 0.55 + (C.size / 100) * 0.75;      /* 0.55 .. 1.30 */
    var fs = Math.round(9 + (C.size / 100) * 7);   /* 9 .. 16 px */
    var P = WG.projector(fix, WG.zoomForStep(curStep), W, H, WG.CAL);
    var box = WG.REACH * scale, placed = [], i, st, x, y, k, hit;

    /* Rectangles a marker may not cover. The scale bar is the check that the
       pairing is right, and the badge is how a mis-pairing announces itself;
       a marker drawn over either removes the thing it was there to reveal. */
    var keepOut = [];
    if (C.bar){
      var barPx = WG.XCT_METRES[curStep] / P.res;
      keepOut.push([0, H - C.barY - 26, 25 + (barPx > 0 ? barPx : 0), H]);
    }
    if (C.badge) keepOut.push([0, 0, 190, 26]);
    function blocked(px, py){
      for (var q = 0; q < keepOut.length; q++){
        var r = keepOut[q];
        if (px > r[0] - box * 0.7 && px < r[2] + box * 0.7 &&
            py > r[1] - box * 0.7 && py < r[3] + box * 0.7) return true;
      }
      return false;
    }

    for (i = 0; i < ranked.length; i++){
      st = ranked[i];
      x = P.x(st.lon); y = P.y(st.lat);
      if (x < -box || x > W + box || y < -box || y > H + box) continue;

      if (blocked(x, y)) continue;

      hit = false;
      for (k = 0; k < placed.length; k++){
        if (Math.abs(x - placed[k][0]) < box * 1.5 &&
            Math.abs(y - placed[k][1]) < box * 1.9){ hit = true; break; }
      }
      if (hit) continue;
      placed.push([x, y]);
      hits.push({ st: st, x: x, y: y, r: box });
      WG.marker.canvas(bctx, st, x, y, scale);
      WG.marker.label(bctx, st, x, y, scale, fs);
    }
    shown = placed.length;
    if (C.bar) drawScaleBar(bctx, P.res);
  }
  /* one atomic replace of the visible canvas */
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "copy";
  ctx.drawImage(buf, 0, 0);
  ctx.restore();
  return shown;
}

/* ── scale bar ────────────────────────────────────────────────────────
   Drawn at the SAME ground distance XCTrack's own bar is labelled with, and
   placed just above it, so the two can be compared by length instead of by
   text. That is the check that matters: equal labels with unequal lengths
   means the calibration is wrong for this device or latitude, and no amount
   of reading the settings would reveal it.

   Bottom-left, mirroring XCTrack's placement. Ours sits higher so both stay
   visible — the body is transparent, so theirs shows through. ───────── */
function drawScaleBar(g, res){
  var m = WG.XCT_METRES[curStep];
  if (!m || !res) return;
  var px = m / res;
  if (px < 24 || px > W - 20) return;          /* would not be comparable */

  /* Left inset matches XCTrack's, measured off the owner's screenshot at ~15 css
     px, so the two bars start at the same x and a difference in LENGTH is the
     only thing left to see. barY tunes the vertical gap: they are compared by
     eye, so the closer together the better, but XCTrack's own label sits above
     its bar and the exact height is device-specific — hence a parameter rather
     than a guess baked in. */
  var x = 15, y = H - C.barY, t = WG.XCT_LADDER[curStep];
  barRight = x + px;
  g.lineCap = "butt"; g.lineJoin = "miter";

  /* TICKS POINT DOWN. XCTrack's point up, so the two bars close on each other
     like facing brackets and their ends line up in a single vertical glance —
     which is the whole comparison, done without reading either number. */
  function trace(){
    g.beginPath();
    g.moveTo(x, y + 7); g.lineTo(x, y); g.lineTo(x + px, y); g.lineTo(x + px, y + 7);
  }
  g.strokeStyle = "#FFFFFF"; g.lineWidth = 5; trace(); g.stroke();
  g.strokeStyle = "#0A1116"; g.lineWidth = 2; trace(); g.stroke();

  /* Number above the line: below it would land in the gap that has to stay
     clear for the comparison. Centred and at XCTrack's size, so the pair reads
     as one control rather than two things that happen to be near each other. */
  g.font = "700 17px ui-monospace, 'Roboto Mono', monospace";
  g.textAlign = "center"; g.textBaseline = "bottom";
  g.lineWidth = 5; g.strokeStyle = "#FFFFFF"; g.lineJoin = "round";
  g.strokeText(t, x + px / 2, y - 4);
  /* Amber while the scale is offset: a permanent, quiet marker that outlives
     the prompt, sitting on the very number that needs comparing. */
  g.fillStyle = (curStep !== C.step) ? "#8A5A00" : "#0A1116";
  g.fillText(t, x + px / 2, y - 4);
}

/* ── fetch ────────────────────────────────────────────────────────── */
function refresh(fix){
  if (fetching || !fix) return;
  fetching = true;
  var bbox = WG.bboxAround(fix, WG.zoomForStep(curStep), W || 448, H || 978, C.pad);
  PROV.fetchBBox(bbox, { maxAgeSec: C.stale * 60 * 4, limit: 500 }, function (err, list){
    fetching = false;
    if (err) fetchErr = err;               /* keep the last good data on screen */
    else { fetchErr = ""; stations = list; lastFetch = Date.now(); }
    drawKey = ""; tick();
  });
}

/* ── badge ────────────────────────────────────────────────────────────
   States the assumption permanently, so a mismatch with the scale XCTrack
   already shows is readable rather than silent.

   Goes red on the two things that make the display untrustworthy: the last
   fetch failed, or every visible reading is stale. Deliberately NOT driven
   by the single oldest station in the box — one distant instrument that
   stopped reporting is not a reason to alarm the whole widget, and
   per-marker staleness already shows in red numbers. ──────────────── */
function paintBadge(fix, shown, nStale){
  var b = document.getElementById("badge"), s, bad = false;
  if (!fix){
    s = "no position"; bad = true;
  } else {
    s = (WG.XCT_LADDER[curStep] || "?") + " N↑";
    if (!lastFetch){
      s += fetchErr ? ("  no data: " + fetchErr) : "  loading…";
      bad = !!fetchErr;
    } else {
      var fetchAge = Math.round((Date.now() - lastFetch) / 60000);
      s += "  " + shown;
      if (nStale) s += "  " + nStale + " stale";
      if (fetchErr){ s += "  OFFLINE " + fetchAge + "m"; bad = true; }
      else if (shown && nStale === shown){ s += "  ALL STALE"; bad = true; }
      else if (fetchAge >= Math.ceil(C.poll / 60) * 2){ s += "  " + fetchAge + "m"; bad = true; }
    }
  }
  if (b.firstChild){ if (b.firstChild.nodeValue !== s) b.firstChild.nodeValue = s; }
  else b.appendChild(document.createTextNode(s));
  var cls = bad ? "bad" : "";
  if (b.className !== cls) b.className = cls;

  /* Separate element, separate concern: the badge reports the data, this
     reports that the pilot still has to act. Amber, not red — red means the
     readings are stale, and conflating the two would blunt both. */
  if (curStep === C.step) hideWarn();
}

/* ── tick: poll at 2 Hz to match XCTrack's map redraw, but repaint only
   when something moved a whole pixel. At z11 a glider at 40 km/h moves
   0.21 px/s, so this is nearly free. ─────────────────────────────── */
function tick(){
  var p = WG.position(C), fix = p.fix;
  if (!fix){ draw(null, []); paintBadge(null, 0, 0); return; }

  if (!lastFetch || Date.now() - lastFetch > C.poll * 1000) refresh(fix);

  var now = Date.now();
  var ranked = WG.prepare(stations, fix, C, now), i, nStale = 0;

  var z = WG.zoomForStep(curStep);
  var key = Math.round(WG.lonToPx(fix.lon, z) * WG.CAL) + "/" +
            Math.round(WG.latToPx(fix.lat, z) * WG.CAL) + "/" +
            W + "x" + H + "/" + curStep + "/" + lastFetch + "/" + Math.round(now / 60000);
  if (key !== drawKey){ drawKey = key; lastShown = draw(fix, ranked); }

  /* Count stale over the markers ACTUALLY DRAWN, not over everything ranked.
     Comparing a count from one population against a total from another made the
     badge claim ALL STALE whenever the stale count in the ranked list happened
     to equal the number drawn — which trains a pilot to ignore the warning, the
     worst possible outcome for it. hits[] is refreshed on every draw, and the
     station objects it points at are re-staled by prepare() every tick, so this
     stays current even when nothing is redrawn. */
  for (i = 0; i < hits.length; i++) if (hits[i].st.stale.cls === "stale") nStale++;

  paintBadge(fix, lastShown, nStale);
}

/* ── detail popup ─────────────────────────────────────────────────────
   Tap a marker for its recent trend. Purely descriptive — the same measured
   values, over time — so it breaks no rule, and it answers the question a
   single reading cannot: is this building or easing?

   History is fetched ON DEMAND, one small call (~0.5-1 KB for a few hours).
   Prefetching it for every marker would be one call per station for data
   nobody asked to see, which is what winds.mobi's "do not overload" forbids.
   ─────────────────────────────────────────────────────────────────── */
function closePop(){
  if (popTimer){ clearTimeout(popTimer); popTimer = null; }
  popStation = null; popHist = null; popErr = "";
  var p = document.getElementById("pop");
  p.hidden = true;
  p.innerHTML = "";
}

function openPop(st){
  var c = histCache[st.id];
  popStation = st; popErr = "";
  /* Reuse anything fetched within one data cycle: the upstream only updates on
     that cadence, so a fresher call would return the same samples. */
  popHist = (c && Date.now() - c.at < C.poll * 1000) ? c.list : null;
  paintPop();
  if (popTimer) clearTimeout(popTimer);
  /* 0 means keep it until dismissed. Otherwise it closes itself, because a
     popup left open over a moving map hides the thing it sits on. */
  if (C.popup > 0) popTimer = setTimeout(closePop, C.popup * 1000);

  if (popHist) return;          /* served from cache; nothing to fetch */
  PROV.fetchHistoric(st.id, { duration: C.hours * 3600 }, function (err, list){
    if (!popStation || popStation.id !== st.id) return;   /* dismissed meanwhile */
    if (err) popErr = err;
    else { popHist = list; histCache[st.id] = { at: Date.now(), list: list }; }
    paintTrend();                 /* only the strip changed */
  });
}

function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function hhmm(ts){
  var d = new Date(ts);
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

/* Two paints, deliberately separate. The shell is written once when a marker is
   tapped; the trend replaces only its own container when the history lands.
   Rewriting the whole panel twice in quick succession is what made tapping a
   second marker flash. */
function paintPop(){
  var p = document.getElementById("pop"), st = popStation, i, s, h = "";
  if (!st){ p.hidden = true; return; }
  p.hidden = false;
  if (p.getAttribute("data-for") === st.id){ paintTrend(); return; }
  p.setAttribute("data-for", st.id);

  h += '<h3>' + esc(st.name) + (st.peak ? ' <span style="color:#54A6DC">▲</span>' : '') + '</h3>';
  h += '<div class="sub">' +
       (isFinite(st.alt) ? Math.round(st.alt) + ' m · ' : '') +
       (Math.round(st.dist / 100) / 10) + ' km · ' + esc(st.provider) + '</div>';

  h += '<div class="now">';
  h += '<b>' + WG.marker.labelText(st) + '</b><i>km/h avg/gust</i>';
  if (st.dir === st.dir) h += '<b style="font-size:19px">' + Math.round(st.dir) + '°</b>';
  h += '<i class="' + (st.stale.cls === "fresh" ? "" : st.stale.cls) + '">' +
       (st.stale.age === st.stale.age ? Math.round(st.stale.age) + ' min old' : 'no timestamp') +
       '</i></div>';

  h += '<div class="trend"></div>';

  h += '<div class="src">Measured values from ' + esc(st.provider) +
       ' via winds.mobi. Not a forecast and not a safety verdict. ' +
       'Tap anywhere to close' + (C.popup > 0 ? ', or wait ' + C.popup + ' s.' : '.') +
       '</div>';
  p.innerHTML = h;
  paintTrend();
}

/* Oldest left, newest right, same marker geometry at small size so a change of
   colour reads the way it does on the map. */
function paintTrend(){
  var tr = document.querySelector("#pop .trend"), i, s, h = "";
  if (!tr) return;
  if (popErr) h = '<span class="wait">trend unavailable: ' + esc(popErr) + '</span>';
  else if (!popHist) h = '<span class="wait">loading trend…</span>';
  else if (!popHist.length) h = '<span class="wait">no history for this station</span>';
  else {
    for (i = 0; i < popHist.length; i++){
      s = popHist[i];
      h += '<div class="t">' +
           WG.marker.svg({ dir:s.dir, avg:s.avg, gust:s.gust,
                           rAvg:WG.rateAvg(s.avg), rGust:WG.rateGust(s.gust) }, 34) +
           '<em>' + WG.marker.labelText(s) + '</em>' +
           '<span>' + hhmm(s.ts) + '</span></div>';
    }
  }
  tr.innerHTML = h;
  /* Oldest-left reads naturally but puts the NEWEST sample — the one most
     wanted — off the right edge on a narrow screen. */
  tr.scrollLeft = tr.scrollWidth;
}

/* Taps inside the popup must not fall through and re-close it or zoom. */
document.getElementById("pop").addEventListener("click", function(ev){
  ev.stopPropagation();
});

function hitTest(x, y){
  /* Nearest marker first, so overlapping ones resolve predictably. */
  var best = null, bd = 1e9, i, d;
  for (i = 0; i < hits.length; i++){
    d = Math.abs(x - hits[i].x) + Math.abs(y - hits[i].y);
    if (d < hits[i].r * 1.6 && d < bd){ bd = d; best = hits[i]; }
  }
  return best;
}

/* ── optional tap zones ───────────────────────────────────────────────
   Off by default, and that default matters: with tapping enabled the WebView
   swallows every touch over its area, so any zone here takes one away from
   XCTrack. Measured 2026-08-11 — a tap never reaches both. See findings.md.

   For this to be useful the pilot must move XCTrack's own zoom buttons
   OUTSIDE the widget rectangle, then re-zoom the map by hand to match. The
   widget cannot verify that happened, so it says SET MAP until reset and the
   scale bar is there to be compared against XCTrack's. ─────────────── */
/* ── the off-scale prompt ─────────────────────────────────────────────
   Shown when the pilot changes our scale, because the map was not told and
   cannot be. It is a PROMPT and it fades: having been told once is enough, and
   a permanent banner down here would sit on XCTrack's own scale bar, which is
   the thing it is asking to be compared against.

   The lasting signal is elsewhere and quieter — the bar's number goes amber
   while offset, right on the value that needs checking. Reset stays on the
   badge, which never fades. ───────────────────────────────────────────── */
var WARN_MS = 15000;
var warnTimer = null;

function showWarn(){
  var wn = document.getElementById("warn");
  /* Beside the bar and level with it, arrow pointing back at the pair — so the
     prompt says WHERE to look, not just what to do. Above it would have been
     one more thing stacked in the corner; below it would cover XCTrack's. */
  wn.style.left = Math.round((C.bar ? barRight : 15) + 12) + "px";
  wn.style.bottom = Math.max(0, C.barY - 14) + "px";
  wn.hidden = false;
  wn.className = "";
  if (warnTimer) clearTimeout(warnTimer);
  warnTimer = setTimeout(function(){ wn.className = "fade"; }, WARN_MS);
}
function hideWarn(){
  if (warnTimer){ clearTimeout(warnTimer); warnTimer = null; }
  var wn = document.getElementById("warn");
  wn.hidden = true; wn.className = "";
}

function stepBy(d){
  var n = curStep + d;
  if (n < WG.XCT_STEP_MIN || n > WG.XCT_STEP_MAX) return;
  curStep = n;
  drawKey = ""; lastFetch = 0;              /* the box moved with the zoom */
  showWarn();
  tick();
}
/* Precedence, and it matters: a marker tap must never be eaten by a zoom zone
   that happens to cover the same pixels. Marker, then dismiss, then zoom. */
function zoneTap(ev, d){
  var r = cv.getBoundingClientRect();
  var x = ev.clientX - r.left, y = ev.clientY - r.top;

  var hit = C.popup !== null && hitTest(x, y);
  if (hit){ openPop(hit.st); return; }
  if (popStation){ closePop(); return; }        /* tap outside dismisses */
  if (d) stepBy(d);
}

if (C.ztap){
  var zi = document.getElementById("zin"), zo = document.getElementById("zout");
  zi.hidden = zo.hidden = false;
  zi.addEventListener("click", function(ev){ zoneTap(ev, +1); });   /* finer */
  zo.addEventListener("click", function(ev){ zoneTap(ev, -1); });   /* coarser */
} else {
  /* No zones, but marker taps still need somewhere to land. The canvas itself
     is only a hit target when there is something to tap. */
  cv.addEventListener("click", function(ev){ zoneTap(ev, 0); });
}

if (C.zbtn){
  var zb = document.getElementById("zbtns");
  zb.className = "p-" + C.zpos + (C.zrow ? " row" : "");
  zb.hidden = false;
  document.getElementById("bIn").addEventListener("click", function(ev){
    ev.stopPropagation(); stepBy(+1);
  });
  document.getElementById("bOut").addEventListener("click", function(ev){
    ev.stopPropagation(); stepBy(-1);
  });
}

function resetScale(ev){
  if (ev) ev.stopPropagation();
  if (curStep === C.step) return;
  curStep = C.step; drawKey = ""; lastFetch = 0; hideWarn(); tick();
}
/* Two ways back, because the prompt fades but the need to reset does not. */
document.getElementById("warn").addEventListener("click", resetScale);
document.getElementById("badge").addEventListener("click", resetScale);

resize();
tick();
setInterval(tick, 500);
</script>
</body>
</html>
