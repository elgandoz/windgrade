<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Windmap, social preview card</title>
<!-- ══════════════════════════════════════════════════════════════════════
     Generates og-windmap.jpg, the 1200x630 image chat apps show when the
     link is pasted. Build-time only: nothing in the shipped pages loads
     this, and it is deliberately NOT in sw.js's ASSETS. No individual
     tool is, and a scraper-only image has no business in an offline cache.

     From the repo root, with a server already running:

       CH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
       "$CH" --headless=new --virtual-time-budget=5000 \
             --window-size=1200,630 --screenshot=/tmp/og-windmap.png \
             "http://localhost:8080/tools/og-card.html"
       magick /tmp/og-windmap.png -quality 86 -strip og-windmap.jpg

     JPEG, NOT PNG, AND THE SECOND COMMAND IS NOT OPTIONAL. A real terrain
     photograph put the png at 349 KB, against 124 KB when this card carried
     flat UI. WhatsApp is the distribution channel for these links and is the
     strictest client about preview size. JPEG q86 is 91 KB and identical at
     the size any client renders it, and there is no transparency to lose.
     Quantising the png instead makes it BIGGER: the dither noise defeats
     png's compression.

     THE PHONE IS A DEVICE CAPTURE OF THE WIDGET IN FLIGHT, tools/og-phone.png,
     taken on a real phone with XCTrack's own map underneath and kept with a
     transparent surround. It replaced a headless capture of app.html on
     2026-08-14. The list page was the wrong subject for a card: a column of
     text rows is a grey smear at the size a chat client actually renders
     this, while terrain with coloured arrows on it survives being shrunk,
     and it is also the thing the tool exists to do. That is the test for
     anything put here.

     To replace it, take a fresh capture on a device and:

       magick <capture>.png -trim +repage -resize 520x -strip tools/og-phone.png

     Two things the old app.html capture had to worry about are gone with it:
     picking a moment when the readings are not legitimately red (MeteoSwiss
     and SLF report on a ~30 min cadence against a `stale` default of 30, so
     for part of every cycle a third of the list is stale), and pinning
     `theme=light` so the capture did not follow the laptop's appearance
     setting. A device capture has neither problem. It does have its own:
     whatever the phone showed is in it for good, so check the readings and
     the map before committing one.
     ═══════════════════════════════════════════════════════════════════ -->
<style>
  @page{margin:0}
  *{box-sizing:border-box;margin:0}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:#0A1116;color:#E8F0F5;display:flex;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .l{flex:1;padding:74px 0 74px 78px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:16px;margin-bottom:34px}
  .brand .nm{font-size:30px;font-weight:700;letter-spacing:-.02em}
  h1{font-size:62px;line-height:1.07;letter-spacing:-.034em;font-weight:700;max-width:13ch}
  p{margin-top:24px;font-size:26px;line-height:1.45;color:#9FB2C0;max-width:24ch}
  .foot{
    margin-top:44px;display:flex;align-items:center;gap:12px;
    font:600 17px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#54A6DC;
  }
  .foot span{width:6px;height:6px;border-radius:50%;background:#54A6DC}
  .r{width:466px;position:relative;display:flex;align-items:flex-end;justify-content:center}
  /* NO FRAME OF OURS: og-phone.png is a device capture that brings its own
     frame and a transparent surround, so a border, a radius and
     overflow:hidden would draw a second frame inside the first. drop-shadow
     follows the real silhouette; box-shadow would shadow the bounding box.
     It bleeds off the bottom on purpose, which is also what lets the phone
     be large enough for the arrows to read at chat-preview size. */
  .r .ph{width:300px;position:relative;z-index:1;line-height:0;margin-bottom:-84px;
    filter:drop-shadow(0 26px 48px rgba(0,0,0,.85))}
  .r .ph img{display:block;width:100%;height:auto}
  .glow{
    position:absolute;inset:auto -140px -180px -60px;height:460px;
    background:radial-gradient(closest-side,rgba(238,138,28,.22),transparent);
  }
</style>
</head>
<body>
<div class="l">
  <div class="brand">
    <!-- THE SAME ART AS icon.svg, and it must stay that way: this card is the
         first thing anyone sees of the tool in a chat app, so a stale logo
         here is a different product as far as a reader is concerned. Four
         stacked strokes from wg/core.js at WG.BANDS widths, PALETTE.green,
         and no plate, exactly as the favicon draws it. viewBox is the
         rotated bounding box, not the reach circle. -->
    <svg width="58" height="58" viewBox="-21.39 -15.13 35.41 35.41" aria-hidden="true">
      <g transform="rotate(35)" stroke-linejoin="round" stroke-linecap="round">
        <path d="M0,-11.75 L9,11.75 L0,4.75 L-9,11.75 Z" fill="none" stroke="#FFFFFF" stroke-width="11"/>
        <path d="M0,-11.75 L9,11.75 L0,4.75 L-9,11.75 Z" fill="none" stroke="#0A1116" stroke-width="8.5"/>
        <path d="M0,-11.75 L9,11.75 L0,4.75 L-9,11.75 Z" fill="none" stroke="#31A85A" stroke-width="5"/>
        <path d="M0,-11.75 L9,11.75 L0,4.75 L-9,11.75 Z" fill="#31A85A" stroke="#3A4750" stroke-width="1"/>
      </g>
    </svg>
    <div class="nm">XCTrack Windmap</div>
  </div>
  <h1>Wind stations on the terrain</h1>
  <p>Speed, gust and direction for every station near you, drawn where they actually are.</p>
  <div class="foot"><span></span>Free Flight Tools</div>
</div>
<div class="r">
  <div class="glow"></div>
  <div class="ph"><img src="og-phone.png" alt=""></div>
</div>
</body>
</html>
