<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1116">
<title>XCTrack Windmap: nearby wind stations</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">

<!-- Social preview. These links get pasted into pilots' chat groups, which is
     the whole distribution channel. Without these tags the paste renders as a
     bare grey URL. Absolute, not relative: WhatsApp, Telegram and Slack do
     resolve a relative og:image, but the spec asks for absolute and some
     scrapers refuse otherwise. Regenerate the card with tools/og-card.html. -->
<meta name="description" content="Wind stations near you, drawn on the terrain they sit on. Speed, gust and direction for paraglider XC pilots.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Free Flight Tools">
<meta property="og:title" content="XCTrack Windmap: wind stations on the terrain">
<meta property="og:description" content="Speed, gust and direction for every station near you, drawn where they actually are.">
<meta property="og:url" content="https://freeflight-tools.github.io/xctrack-windmap/app.html">
<meta property="og:image" content="https://freeflight-tools.github.io/xctrack-windmap/og-windmap.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Windmap listing nearby wind stations with speed, gust, altitude and direction.">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="wg/base.css">
<style>
/* Data first. Settings live in a collapsed sheet pinned to the bottom, so a
   pilot scanning readings never scrolls past a form to reach them. */
body{padding:8px 8px calc(58px * var(--scale))}
/* Title and the freshness control on one line. The control IS the age, because
   "3 min ago" next to a refresh arrow says what tapping it does. A separate
   Refresh button said nothing about what was being refreshed, and took a whole
   row of a screen that exists to show readings. */
#top{display:flex;align-items:center;gap:8px;margin:0 0 6px}
h1{flex:1;font-size:.86em;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--dim)}
#bRef{flex:none;display:flex;align-items:center;gap:5px;padding:6px 10px;
  background:var(--panel-hi);border:1px solid var(--rule);border-radius:14px;
  color:var(--fg);font:600 .78em var(--sans)}
#bRef i{font-style:normal;font-size:1.05em;line-height:1}
#bRef.old{border-color:var(--amber);color:var(--amber)}
#bRef.busy{opacity:.55}
/* One plain sentence. What the list is, and anything about it that is not
   obvious from looking, never coordinates, never kilobytes. */
#say{margin:0 0 8px;font-size:.86em;line-height:1.45;color:var(--dim)}
#say b{color:var(--fg)}
#dbg{font-family:var(--mono);font-size:.72em;color:var(--dim);margin:0 0 8px;
  white-space:pre-wrap;overflow-wrap:anywhere}
#err{margin:6px 0;padding:8px;border-radius:3px;font-size:.84em;
  background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber)}
#err b{color:var(--amber-str)}

/* chip: marker, then numbers, then facts. The number is never optional. */
.chip{margin:0 0 5px;background:var(--panel);border:1px solid var(--rule);
  border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
/* The tappable part. A <button> and not a div: it is focusable, it announces
   itself as a control, and Enter works. For free, on a page whose whole point
   is being usable one-handed. */
.chip > .row{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;
  background:none;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.chip.stale{border-color:var(--red);background:var(--stale-bg)}
.chip.warn{border-color:var(--warn-line)}
.chip.open{border-color:var(--chart)}

/* ── the expanded trend ─────────────────────────────────────────────
   Expand in place rather than a bottom sheet: a list where tapping a row opens
   it is the most conventional pattern on a phone, it needs no dismiss gesture
   to discover, and it keeps the neighbouring stations visible, which is the
   comparison a pilot is actually making. The overlay needs a popup because a
   map has no rows; this does not.

   Fixed min-height so the row does not resize again when the history lands a
   moment after the tap. Same lesson as the widget's popup. */
.detail{border-top:1px solid var(--rule);padding:8px 8px 9px}
.trend{display:flex;gap:3px;overflow-x:auto;min-height:calc(62px * var(--scale));
  align-items:center;-webkit-overflow-scrolling:touch}
/* Set by WG.marker.trendScroll only while samples are hidden off to the left,
   so a half-visible oldest cell reads as "scrolled" and not as a stray value. */
.trend.cut{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 24px);
  mask-image:linear-gradient(to right,transparent 0,#000 24px)}
.trend .wait{color:var(--dim);font:400 .78em var(--mono)}
.trend .t{flex:none;width:calc(44px * var(--scale));text-align:center}
.trend .t svg{display:block;width:calc(34px * var(--scale));
  height:calc(34px * var(--scale));margin:0 auto}
.trend .t em{display:block;font:700 .74em var(--mono);font-style:normal}
.trend .t span{display:block;color:var(--dim);font:400 .62em var(--mono)}
.detail .src{color:var(--dim);font-size:.7em;line-height:1.45;margin-top:7px}
.mk{flex:none;width:calc(44px * var(--scale));height:calc(44px * var(--scale))}
.num{flex:none;min-width:calc(84px * var(--scale));font-family:var(--mono);font-weight:700;
  font-size:1.22em;letter-spacing:-.02em;text-align:right}
.num small{display:block;font-size:.52em;font-weight:400;color:var(--dim);letter-spacing:.06em}
.meta{flex:1 1 auto;min-width:0}
.nm{font-weight:600;font-size:.94em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-family:var(--mono);font-size:.72em;color:var(--dim);margin-top:2px;
  overflow-wrap:anywhere}
.age.warn{color:var(--amber)} .age.stale{color:var(--red);font-weight:700}
.pk{color:var(--chart)}
.st-orange{color:var(--amber)} .st-red{color:var(--red)}

footer{margin-top:14px;padding-top:8px;border-top:1px solid var(--rule);
  font-size:.72em;line-height:1.55;color:var(--dim)}
/* Before the first render there is nothing to attribute, and a lone rule
   across an otherwise empty page reads as a broken layout. */
footer:empty{display:none}
/* No top rule of its own: it sits under the attribution footer, so a second
   border would read as a separate section rather than a closing note. */
.priv{margin:8px 0 0;font-size:.72em;line-height:1.55;color:var(--dim)}

/* ── settings sheet ─────────────────────────────────────────────── */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;
  background:var(--panel);border-top:1px solid var(--rule);z-index:5}
#sheet > summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:12px;font:600 .8em var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim)}
#sheet > summary::-webkit-details-marker{display:none}
#sheet > summary::after{content:"▲";margin-left:auto;font-size:.8em}
#sheet[open] > summary::after{content:"▼"}
#sheet .inner{padding:0 12px}
.sheetfoot{display:flex;gap:8px;padding:12px}
.sheetfoot button,.sheetfoot a{flex:1;padding:10px;background:var(--panel-hi);
  border:1px solid var(--rule);border-radius:3px;color:var(--fg);
  font:600 .84em var(--sans);text-align:center;text-decoration:none}

#bRef:active,.sheetfoot button:active,.sheetfoot a:active{background:var(--rule)}
@media (hover:hover) and (pointer:fine){
  #bRef,.sheetfoot button,.sheetfoot a{transition:border-color .12s}
  #bRef:hover,.sheetfoot button:hover,.sheetfoot a:hover{border-color:var(--chart)}
  #sheet > summary:hover{color:var(--fg)}
}
</style>
</head>
<body>

<div id="top">
  <h1>Windmap</h1>
  <button id="bRef" type="button" title="Check for new readings">
    <i aria-hidden="true">↻</i><span id="age">…</span></button>
</div>
<p id="say">Starting…</p>
<div id="dbg" hidden></div>
<div id="err" hidden></div>
<div id="list"></div>

<footer id="foot"></footer>

<!-- Static, so it stays out of the tick loop's DOM writes entirely. #foot is
     rewritten on a key change, this never is. Says what actually happens: a
     bounding box goes out, not a position, and nothing comes back that
     identifies the pilot. -->
<p class="priv">Your position stays on your phone. Only the area around you is sent
  to winds.mobi, to ask which stations are in it. No accounts, no analytics.</p>

<details id="sheet">
  <summary>Settings</summary>
  <div class="inner" id="fields"></div>
  <div class="sheetfoot">
    <button id="reset" type="button">Reset</button>
    <!-- target=_blank ON PURPOSE. Installed as a PWA this page runs in a
         standalone window whose manifest scope is "./", so a plain link to
         index.html navigates INSIDE the app and strands the pilot in a setup
         guide with no way back. There is no API for "open in the default
         browser"; _blank is what hands it to one. A Custom Tab on Android,
         Safari on iOS, a normal tab on desktop. The other lever would be
         narrowing the manifest scope so index.html falls outside it, which
         would also push every future page out. Not worth it for one link. -->
    <a href="index.html" target="_blank" rel="noopener">Set up the XCTrack overlay ↗</a>
  </div>
</details>

<script src="wg/core.js"></script>
<script src="wg/marker.js"></script>
<script src="wg/windsmobi.js"></script>
<script src="wg/fields.js"></script>
<script src="wg/offline.js"></script>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   app.html, the standalone list. Phase 2: data, no map.

   Useful on its own, and the place the rating scale gets judged. Renders the
   real marker geometry, so the colours can be evaluated without XCTrack.

   Installable: it keeps its settings in localStorage and its shell in a
   service worker. The SHELL only. Readings are never cached, because old
   wind shown confidently is the one way this could hurt someone. See sw.js.

   Rows are built once and only changed text nodes are rewritten, so a
   stationary pilot with unchanged readings causes no DOM writes.
   ═══════════════════════════════════════════════════════════════════ */

/* Stored settings, then the URL on top: a shared link means what it says. */
var C = WG.initConfig(location.search, { store: true });
var PROV = WG.providers.windsmobi;
var stations = [], lastFetch = 0, lastErr = "", fetching = false, meta1 = "";
var capped = false;                   /* the API truncated at its own limit */
var rows = {};                        /* id -> {el, cache} */
/* Caches, so a tick that changes nothing writes nothing. See tick(). */
var renderKey = "", footNets = null, ageText = "", ageCls = "", detailOn = null;

function el(id){ return document.getElementById(id); }

/* Only the scale labels need this here, but the engine is shared and one page
   silently disagreeing with the other is exactly what drifts. */
WG.setDpr(C.dpr || window.devicePixelRatio || WG.DPR_REF);
WG.applyTheme();

/* ── position: browser geolocation on a laptop, XCTrack on the phone ── */
if (navigator.geolocation){
  navigator.geolocation.watchPosition(function(p){
    WG.setGeoFix({ lat:p.coords.latitude, lon:p.coords.longitude,
                   alt:p.coords.altitude, src:"geo", valid:true });
    tick();
  /* Short, and it does NOT repeat the hint the sentence above already gives.
     Two boxes saying the same thing reads as two problems. */
  }, function(){ note("Location access is blocked for this page."); },
     { enableHighAccuracy:true, maximumAge:10000, timeout:20000 });
}

function note(s){ lastErr = s; paintErr(); }
function paintErr(){
  var e = el("err");
  e.hidden = !lastErr;
  if (lastErr) e.textContent = lastErr;
}

/* ── the freshness control ─────────────────────────────────────────────
   Readings move on a ~10 min cadence and tick() refetches on its own, so this
   is not load-bearing. But "how old is this" is the one question a pilot must
   always be able to answer, and putting the refresh on the answer costs no
   extra screen. Goes amber past two poll intervals, the same threshold the
   overlay's status line uses, so the two pages never disagree about when data
   has gone quietly old. */
function paintAge(){
  var b = el("bRef"), t;
  if (fetching) t = "checking…";
  else if (!lastFetch) t = "no data";
  else {
    var min = Math.round((Date.now() - lastFetch) / 60000);
    t = (min < 1) ? "just now" : (min + " min ago");
  }
  if (t !== ageText){ ageText = t; el("age").textContent = t; }
  /* Compared before assigning: setting className to the value it already holds
     is still a style invalidation, and this runs on every tick. */
  var old = !!lastFetch && (Date.now() - lastFetch) > C.poll * 2000;
  var cls = (fetching ? "busy" : "") + (old ? " old" : "");
  if (cls !== ageCls){ ageCls = cls; b.className = cls; }
}

/* Shared with the overlay widget, so the two renderings cannot drift. */
function marker(st){ return WG.marker.svg(st, null, { cls: "mk" }); }

/* ── rows ─────────────────────────────────────────────────────────── */
function buildRow(st){
  var d = document.createElement("div");
  d.className = "chip";
  d.innerHTML =
    '<button class="row" type="button" aria-expanded="false">' +
      marker(st) +
      '<div class="num"><span></span><small></small></div>' +
      '<div class="meta"><div class="nm"></div><div class="sub"></div></div>' +
    '</button>';
  d.firstChild.addEventListener("click", (function (id) {
    return function () { toggleOpen(id); };
  })(st.id));
  return { el:d, cache:{} };
}
function mkNode(st){
  var wrap = document.createElement("div");
  wrap.innerHTML = marker(st);
  return wrap.firstChild;
}

function paintRow(r, st){
  var c = r.cache;
  /* The marker is the button's first child now, not the chip's, the chip also
     holds the expanded trend. Replacing r.el.firstChild here would swap out the
     whole control. */
  var rowEl = r.el.firstChild;

  var key = st.rAvg + "/" + st.rGust + "/" + (st.dir | 0) + "/" + st.avg + "/" + st.gust;
  if (c.mk !== key){ rowEl.replaceChild(mkNode(st), rowEl.firstChild); c.mk = key; }

  var num = WG.marker.labelText(st);
  if (c.num !== num){ r.el.querySelector(".num span").textContent = num; c.num = num; }

  var unit = "km/h" + ((st.dir === st.dir) ? " · " + Math.round(st.dir) + "°" : "");
  if (c.unit !== unit){ r.el.querySelector(".num small").textContent = unit; c.unit = unit; }

  var nm = st.name + (st.peak ? "|peak" : "");
  if (c.nm !== nm){
    var nmEl = r.el.querySelector(".nm");
    nmEl.textContent = "";
    nmEl.appendChild(document.createTextNode(st.name + " "));
    if (st.peak){
      var p = document.createElement("span");
      p.className = "pk"; p.textContent = "▲"; p.title = "on a summit";
      nmEl.appendChild(p);
    }
    c.nm = nm;
  }

  /* Order is by usefulness, and it decides what falls off the end when the line
     wraps: how far and which way (which is also how the list is sorted), then
     how high, then how old. THE AGE MUST COME BEFORE THE ATTRIBUTION. It is
     the field that decides whether the reading can be trusted at all, and it
     must never be the thing that wraps out of sight. The geocoded municipality
     sits after it, still present because it is the one word a pilot who does
     not know the site can place on a map, but no longer ahead of the facts. */
  var head = (Math.round(st.dist / 100) / 10) + " km " + compass(st.brg) + " · " +
             (isFinite(st.alt) ? Math.round(st.alt) + " m · " : "");
  var tail = (st.place ? " · " + st.place : "") + " · " + st.provider;
  var sk = head + "|" + tail + "|" + st.stale.cls + "|" +
           Math.round(st.stale.age) + "|" + st.status;
  if (c.sub !== sk){
    var subEl = r.el.querySelector(".sub");
    subEl.textContent = "";
    subEl.appendChild(document.createTextNode(head));
    /* "13 min" alone does not say what the number measures. "ago" does. */
    var ag = document.createElement("span");
    ag.className = "age " + st.stale.cls;
    ag.textContent = (st.stale.age === st.stale.age)
      ? Math.round(st.stale.age) + " min ago" : "no time given";
    subEl.appendChild(ag);
    subEl.appendChild(document.createTextNode(tail));
    if (st.status === "orange" || st.status === "red"){
      var s2 = document.createElement("span");
      s2.className = "st-" + st.status;
      s2.textContent = "  station " + st.status;
      subEl.appendChild(s2);
    }
    c.sub = sk;
  }

  var cls = "chip" + (st.stale.cls === "fresh" ? "" : " " + st.stale.cls) +
            (openId === st.id ? " open" : "");
  if (r.el.className !== cls) r.el.className = cls;
}

function compass(b){
  if (b !== b) return "";
  var n = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return n[Math.round(b / 22.5) % 16];
}

/* ── tap a station for its recent trend ───────────────────────────────
   Descriptive only: the same measured values this station already reports, over
   time. It answers the one thing a single reading cannot. Is this building or
   easing, without inferring anything.

   History is fetched ON DEMAND, one small call (~0.5-1 KB for a few hours), and
   cached for one poll interval. Prefetching for every row would be one HTTP
   call per station for data nobody asked to see, which is exactly what
   winds.mobi's "do not overload" forbids. That is why this is a tap and not a
   sparkline on every chip.

   ONE open at a time: two open rows means two histories in flight and a list
   that has to be scrolled to compare anything. Tapping the open row closes it.
   ─────────────────────────────────────────────────────────────────── */
var openId = null, hist = null, histErr = "", histCache = {};

function toggleOpen(id){
  if (openId === id){ openId = null; hist = null; histErr = ""; tick(); return; }
  openId = id; hist = null; histErr = "";

  /* Reuse anything fetched within one data cycle. Upstream only updates on that
     cadence, so a second call would return the same samples. */
  var c = histCache[id];
  if (c && Date.now() - c.at < C.poll * 1000) hist = c.list;
  tick();
  if (hist) return;

  PROV.fetchHistoric(id, { duration: C.hours * 3600 }, function (err, list){
    if (openId !== id) return;                      /* closed meanwhile */
    if (err) histErr = "no connection";
    else {
      hist = list;
      /* Sweep on insert. An entry is only ever REUSED inside one poll interval,
         the check above enforces that. So anything older is dead weight
         that would otherwise be held until the next settings change. A pilot
         tapping their way down a long list was accumulating a few hundred
         samples per station for no one. */
      var cut = Date.now() - C.poll * 1000, k;
      for (k in histCache)
        if (histCache.hasOwnProperty(k) && histCache[k].at < cut) delete histCache[k];
      histCache[id] = { at: Date.now(), list: list };
    }
    paintDetail();
  });
}

/* The shell is written when the row opens; only the strip is replaced when the
   history lands. Rewriting the whole panel twice in quick succession is what
   made the widget's popup flash. */
function openDetail(r, st){
  var d = document.createElement("div");
  d.className = "detail";
  d.innerHTML = '<div class="trend"></div>' +
    '<div class="src">Last ' + C.hours + (C.hours === 1 ? " hour" : " hours") +
    ', oldest first, from ' + WG.marker.esc(st.provider) +
    '. Measured, not a forecast.</div>';
  r.el.appendChild(d);
  paintDetail();
}

function paintDetail(){
  var r = openId && rows[openId], tr;
  if (!r) return;
  tr = r.el.querySelector(".trend");
  if (!tr) return;
  tr.innerHTML = WG.marker.trendHtml(hist, { size:34, err:histErr });
  WG.marker.trendScroll(tr);
}

/* Called from render(): attach the panel to whichever row is open, detach the
   one that used to hold it. Driven from `openId` rather than from the click, so
   a re-render. New readings, a settings change. Cannot leave a stale panel on
   a row that has since moved or gone.

   `detailOn` tracks where the panel currently is, so this touches AT MOST TWO
   rows. It used to walk every ranked row and run a querySelector on each, which
   at the default cap is 120 selector queries per render for a thing that can
   only ever be attached in one place. */
function syncDetail(ranked){
  var r, d, i, st = null;
  if (detailOn === openId) return;

  if (detailOn && rows[detailOn]){
    r = rows[detailOn];
    d = r.el.querySelector(".detail");
    if (d) r.el.removeChild(d);
    r.el.firstChild.setAttribute("aria-expanded", "false");
  }
  detailOn = null;
  if (!openId) return;

  r = rows[openId];
  if (!r) return;                       /* left the list; render() clears openId */
  for (i = 0; i < ranked.length; i++) if (ranked[i].id === openId){ st = ranked[i]; break; }
  if (!st) return;
  openDetail(r, st);
  r.el.firstChild.setAttribute("aria-expanded", "true");
  detailOn = openId;
}

/* ── render ───────────────────────────────────────────────────────── */
function render(fix){
  var list = el("list"), i, st, r, seen = {}, id;
  /* The same radius the fetch used, so the list shows a circle and not the
     bounding square's corners. A station at 55 km appearing while another at
     45 km does not is exactly the arbitrary bias this replaced. */
  var ranked = WG.prepare(stations, fix, C, Date.now(), { r: C.range * 1000 });

  for (i = 0; i < ranked.length; i++){
    st = ranked[i]; seen[st.id] = 1;
    r = rows[st.id] || (rows[st.id] = buildRow(st));
    paintRow(r, st);
    if (list.childNodes[i] !== r.el) list.insertBefore(r.el, list.childNodes[i] || null);
  }
  for (id in rows){
    if (rows.hasOwnProperty(id) && !seen[id]){
      if (rows[id].el.parentNode) rows[id].el.parentNode.removeChild(rows[id].el);
      delete rows[id];
      /* A station can leave the list while its trend is open, the pilot moved,
         or the scale changed. Drop the open state with it, or paintDetail()
         hunts for a row that no longer exists. */
      if (openId === id){ openId = null; hist = null; histErr = ""; }
    }
  }
  syncDetail(ranked);

  /* ONE plain sentence, then the exceptions. Anything with a number in it that
     a pilot cannot act on belongs in the debug line, not here. */
  say(ranked);

  /* Attribution is owed to the networks that own the readings, not only to the
     aggregator, so the list is rebuilt from what is actually on screen. The
     safety wording stays. It is the shortest it can be and still say what it
     has to.

     CACHED ON THE NETWORK LIST. This was an unconditional textContent write on
     every render, so ~250 characters of unchanging legal text were replaced
     every few seconds. Visible as a flicker, and the reason this whole pass
     happened. The networks only change when the fetch brings different
     stations, which is at most once per poll interval. */
  var nets = WG.attribution(ranked).join(", ");
  if (nets !== footNets){
    footNets = nets;
    el("foot").textContent =
      "Readings from " + (nets || ", ") + ", via winds.mobi. " +
      "Measured values only: altitude, speed, gust, direction. Nothing is " +
      "interpolated or guessed between stations. The colours are a rough aid, " +
      "NOT an assessment of whether a flight is safe. Readings cannot work " +
      "offline, treat anything marked old as unknown.";
  }
}

/* ── the sentence ──────────────────────────────────────────────────────
   Replaces a mono line that read
     src=url 44.88000,7.33000 / scale 8km ≙ z9.0 · 1.8 KB · 15 ms · 7 stations
   which is four facts a pilot cannot use and one they can. All of it moved
   behind ?debug=1, the same switch the overlay uses. */
function say(ranked){
  var n = ranked.length, i, nStale = 0, parts;
  for (i = 0; i < n; i++) if (ranked[i].stale.cls === "stale") nStale++;

  if (!n){
    setSay("No stations within " + C.range + " km. Try a larger " +
           "<b>How far to look</b> in Settings.");
    return;
  }
  parts = "<b>" + n + (n === 1 ? " station</b> near you" : " stations</b> near you") +
          ", closest first.";
  /* Old readings are already red on their own row; this says how many, so a
     list that is mostly red is obvious before scrolling it. */
  if (nStale === n) parts += " <b>Every one is out of date</b>, treat them all as unknown.";
  else if (nStale) parts += " <b>" + nStale + "</b> " +
       (nStale === 1 ? "is too old to trust" : "are too old to trust") + ".";
  /* The provider truncates at its own limit with no documented ordering, so
     stations exist that we were never sent. Never silent. */
  if (capped) parts += " There are more stations around you than can be " +
                       "downloaded at once. Try a smaller <b>How far to " +
                       "look</b>.";
  setSay(parts);
}
function setSay(html){
  var s = el("say");
  if (s.getAttribute("data-h") !== html){ s.innerHTML = html; s.setAttribute("data-h", html); }
}

/* ── fetch ────────────────────────────────────────────────────────── */
function refresh(fix){
  if (fetching || !fix) return;
  fetching = true;
  /* A CIRCLE, not a phone-shaped rectangle. This page has no map, so it had no
     business borrowing the overlay's viewport geometry to decide how far to
     look, see bboxRadius() in core.js. The square is the circle's bounding
     box; prepare() trims the corners back to the real radius. */
  var bbox = WG.bboxRadius(fix, C.range * 1000);
  paintAge();                                   /* show "checking…" at once */
  PROV.fetchBBox(bbox, { maxAgeSec: C.stale * 60 * 4, limit: 500 }, function (err, list, meta){
    fetching = false;
    /* Keep whatever is on screen and say the download failed. Wording matters:
       a pilot has to know the numbers below are the OLD ones. */
    if (err) note(lastFetch
      ? "No connection. These readings are from the last time it worked."
      : "No connection, and nothing downloaded yet.");
    else {
      lastErr = ""; paintErr();
      stations = list; lastFetch = Date.now();
      capped = !!meta.capped;
      meta1 = (meta.bytes / 1024).toFixed(1) + " KB · " + meta.ms + " ms · " +
              meta.count + " received" + (meta.capped ? " (TRUNCATED)" : "");
    }
    tick();
  });
}

/* ── tick ──────────────────────────────────────────────────────────────
   Same discipline as the overlay: A KEY FIRST, and render() only when it
   changes. Before this, every tick ran WG.prepare() over up to 120 stations
   (distance, bearing, two rating lookups and a staleness test each, then a
   sort), walked every row, and rewrote the footer's ~250 characters of unchanging
   text. That last one was visible as a flicker every few seconds, which is what
   started this.

   What can change a row, and therefore what is in the key:
     the position, to ~0.001° (about 100 m). Rows are sorted by distance and the
       printed value is to 0.1 km, so reordering below that is noise.
     the last fetch. New readings
     the MINUTE, the granularity at which "14 min ago" and the amber/red
       staleness classes can change
     which row is expanded

   A settings change goes through dropRows(), which clears the key, so the whole
   list is rebuilt rather than diffed against stale caches.

   paintAge() stays OUTSIDE the key: it is two string compares and it is the one
   thing that must never be stale, since it is the display's own claim about how
   much it can be trusted. ────────────────────────────────────────────── */
function tick(){
  var p = WG.position(C), fix = p.fix;
  paintAge();
  if (!fix){
    setSay("<b>Waiting for your location.</b> Allow this page to use it, or " +
           "add <code>?lat=47.05&amp;lng=8.64</code> to the address to try a " +
           "fixed spot.");
    paintDbg(null, p);
    renderKey = "";                /* so the first fix always draws */
    return;
  }
  if (!lastFetch || Date.now() - lastFetch > C.poll * 1000) refresh(fix);

  var now = Date.now();
  var key = fix.lat.toFixed(3) + "," + fix.lon.toFixed(3) + "/" + lastFetch +
            "/" + Math.round(now / 60000) + "/" + openId;
  if (key !== renderKey){ renderKey = key; render(fix); }
  paintDbg(fix, p);
}

/* Everything that used to be in the header, unchanged in content and now
   behind one switch. Same `debug` the overlay uses, so a bug report from
   either page shows the same fields. */
function paintDbg(fix, p){
  var d = el("dbg");
  if (!C.debug){ if (!d.hidden) d.hidden = true; return; }
  d.hidden = false;
  var t = fix
    ? ("src=" + fix.src + "  " + fix.lat.toFixed(5) + "," + fix.lon.toFixed(5) +
       (isFinite(fix.alt) ? "  " + Math.round(fix.alt) + " m" : "") + "\n" +
       "range " + C.range + " km  cap " + C.max +
       (meta1 ? "\n" + meta1 : ""))
    : ("no fix, " + p.note);
  if (d.textContent !== t) d.textContent = t;
}

/* ── settings sheet, generated from WG.SPEC so it can never drift ──
   Zoom and the fetch margin change WHAT to fetch, so any change forces a
   refetch; the rest only affect rendering, but one path is simpler than
   two and a refetch costs one ~18 KB call. */
var fields = WG.fields(el("fields"), {
  skipWidgetOnly: true,
  onChange: function(){
    dropRows();
    lastFetch = 0;
    tick();
  }
});
function dropRows(){
  for (var id in rows) if (rows.hasOwnProperty(id)){
    if (rows[id].el.parentNode) rows[id].el.parentNode.removeChild(rows[id].el);
    delete rows[id];
  }
  openId = null; hist = null; histErr = "";
  /* Cached histories go too: `hours` may have just changed, and a cached
     3-hour strip shown under a 6-hour heading is a quiet lie. */
  histCache = {};
  /* Every per-element cache is now invalid, the elements are gone. */
  renderKey = ""; footNets = null; detailOn = null;
}

el("reset").addEventListener("click", function(){
  WG.resetConfig();
  C = WG.getConfig();
  WG.applyTheme();
  fields.reload();
  dropRows();
  lastFetch = 0;
  tick();
});
el("bRef").addEventListener("click", function(){ lastFetch = 0; tick(); });

tick();

/* 15 s, not 5. Nothing on this page changes faster than once a minute. The age
   text, the staleness colours, and the poll trigger are all minute-or-slower.
   So 5 s was three times the wakeups for the same display, and a wakeup on a
   phone is a radio and a CPU coming out of idle.

   Paused while the page is hidden. An installed PWA left on a home screen was
   running a full prepare-and-render every 5 s behind whatever the pilot was
   actually looking at; on becoming visible it ticks at once, and tick() refetches
   by itself if the data has gone past its poll interval. */
var timer = setInterval(tick, 15000);
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ if (timer){ clearInterval(timer); timer = 0; } }
  else if (!timer){ timer = setInterval(tick, 15000); tick(); }
});
</script>
</body>
</html>
