<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Windgrade widget</title>
<style>
/* The body stays UNPAINTED. XCTrack renders white or absent as transparent,
   which is what lets this float over its map. Never add a background. */
html,body{margin:0;padding:0;background:transparent;height:100%;overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;left:0;top:0;width:100%;height:100%}
/* The badge carries its own background; nothing else does. */
#badge{position:absolute;left:0;top:0;padding:2px 5px;
  background:rgba(10,17,22,.78);color:#E8F0F5;
  font:600 11px/1.25 ui-monospace,"Roboto Mono",monospace;white-space:pre}
#badge.bad{background:rgba(126,26,20,.92)}
#badge.off{background:rgba(120,84,12,.92)}
/* Only present when ztap=1. Invisible: they exist to catch a tap, not to be
   looked at. Nothing else in this widget is a hit target, deliberately —
   with tapping enabled the WebView swallows every touch over its area, so a
   zone here is a zone taken away from XCTrack. */
.zone{position:absolute;left:0;width:100%;height:50%}
#zin{top:0} #zout{top:50%}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="zin" class="zone" hidden></div>
<div id="zout" class="zone" hidden></div>
<div id="badge"></div>

<script src="wg/core.js"></script>
<script src="wg/marker.js"></script>
<script src="wg/windsmobi.js"></script>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   widget.html — Phase 3b. Arrows only, on a transparent page, stacked ON
   TOP of an XCTrack map widget covering the same rectangle.

   REQUIRED XCTrack SETUP
     XC map widget (below):  scale per the badge, rotation NORTH-UP
     This widget (above):    same rectangle, refresh rate 0,
                             "Allow web page to access XCTrack data" ON

   Refresh rate MUST be 0. With ${lat}/${lng} substitution XCTrack reloads
   the whole page on its refresh interval, which would bin the canvas, the
   station cache and any in-flight fetch every minute or two.

   The badge states the zoom and the XCTrack scale it pairs with, so a
   mis-paired map reads as a disagreement between two labels rather than as
   silent drift. Arrow POSITIONS are the only thing a mis-pairing breaks;
   numbers, colours and altitudes stay correct regardless.
   ═══════════════════════════════════════════════════════════════════ */

var C = WG.cfg(location.search);
var PROV = WG.providers.windsmobi;
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");

/* Double buffered. Markers are drawn into an offscreen canvas and blitted
   in ONE composite-copy operation, so the visible canvas is never caught
   cleared-but-not-yet-redrawn. That is a flicker risk at 2 Hz over a moving
   map, and it also made headless screenshots come out blank — the capture
   landed between the clear and the redraw. */
var buf = document.createElement("canvas"), bctx = buf.getContext("2d");

var W = 0, H = 0, dpr = 1;
/* The scale actually being drawn. Equals C.step until the pilot taps a zone;
   after that the widget CANNOT know whether the map followed, which is why the
   badge marks it and the scale bar exists. */
var curStep = C.step;
var stations = [], lastFetch = 0, fetchErr = "", fetching = false;
var drawKey = "", lastShown = 0;

/* ── sizing. Cap the backing store at DPR 2: the probe measured DPR 3, and
   full-DPR costs ~9x the fill rate for no legibility gain at 100 m/px. ── */
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = buf.width = Math.round(W * dpr);
  cv.height = buf.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawKey = "";
}
window.addEventListener("resize", resize);

/* Marker and label come from wg/marker.js, shared with app.html's SVG so the
   geometry, the band widths and the downwind rotation cannot drift between the
   two renderings. Extracted from this file because it was untestable here. */

/* ── draw ─────────────────────────────────────────────────────────────
   Declutter by collision, nearest first, evicting WHOLE markers. A number
   without its arrow has lost its direction; an arrow without its number has
   lost the reading. Either half alone is worse than omitting the station —
   see the SeeYou decluttering bug in handover.md. ──────────────────── */
function draw(fix, ranked){
  bctx.clearRect(0, 0, W, H);
  var shown = 0;
  if (fix){
    var scale = 0.55 + (C.size / 100) * 0.75;      /* 0.55 .. 1.30 */
    var fs = Math.round(9 + (C.size / 100) * 7);   /* 9 .. 16 px */
    var P = WG.projector(fix, WG.zoomForStep(curStep), W, H, WG.CAL);
    var box = WG.REACH * scale, placed = [], i, st, x, y, k, hit;

    for (i = 0; i < ranked.length; i++){
      st = ranked[i];
      x = P.x(st.lon); y = P.y(st.lat);
      if (x < -box || x > W + box || y < -box || y > H + box) continue;

      hit = false;
      for (k = 0; k < placed.length; k++){
        if (Math.abs(x - placed[k][0]) < box * 1.5 &&
            Math.abs(y - placed[k][1]) < box * 1.9){ hit = true; break; }
      }
      if (hit) continue;
      placed.push([x, y]);
      WG.marker.canvas(bctx, st, x, y, scale);
      WG.marker.label(bctx, st, x, y, scale, fs);
    }
    shown = placed.length;
    if (C.bar) drawScaleBar(bctx, P.res);
  }
  /* one atomic replace of the visible canvas */
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "copy";
  ctx.drawImage(buf, 0, 0);
  ctx.restore();
  return shown;
}

/* ── scale bar ────────────────────────────────────────────────────────
   Drawn at the SAME ground distance XCTrack's own bar is labelled with, and
   placed just above it, so the two can be compared by length instead of by
   text. That is the check that matters: equal labels with unequal lengths
   means the calibration is wrong for this device or latitude, and no amount
   of reading the settings would reveal it.

   Bottom-left, mirroring XCTrack's placement. Ours sits higher so both stay
   visible — the body is transparent, so theirs shows through. ───────── */
function drawScaleBar(g, res){
  var m = WG.XCT_METRES[curStep];
  if (!m || !res) return;
  var px = m / res;
  if (px < 24 || px > W - 20) return;          /* would not be comparable */

  var x = 10, y = H - 52, t = WG.XCT_LADDER[curStep];
  g.lineCap = "butt"; g.lineJoin = "miter";

  /* white casing under everything, so it survives a dark or light map */
  g.strokeStyle = "#FFFFFF"; g.lineWidth = 5;
  g.beginPath();
  g.moveTo(x, y - 6); g.lineTo(x, y); g.lineTo(x + px, y); g.lineTo(x + px, y - 6);
  g.stroke();
  g.strokeStyle = "#0A1116"; g.lineWidth = 2;
  g.beginPath();
  g.moveTo(x, y - 6); g.lineTo(x, y); g.lineTo(x + px, y); g.lineTo(x + px, y - 6);
  g.stroke();

  g.font = "700 13px ui-monospace, 'Roboto Mono', monospace";
  g.textAlign = "left"; g.textBaseline = "bottom";
  g.lineWidth = 4; g.strokeStyle = "#FFFFFF"; g.lineJoin = "round";
  g.strokeText(t, x, y - 8);
  g.fillStyle = "#0A1116";
  g.fillText(t, x, y - 8);
}

/* ── fetch ────────────────────────────────────────────────────────── */
function refresh(fix){
  if (fetching || !fix) return;
  fetching = true;
  var bbox = WG.bboxAround(fix, WG.zoomForStep(curStep), W || 448, H || 978, C.pad);
  PROV.fetchBBox(bbox, { maxAgeSec: C.stale * 60 * 4, limit: 500 }, function (err, list){
    fetching = false;
    if (err) fetchErr = err;               /* keep the last good data on screen */
    else { fetchErr = ""; stations = list; lastFetch = Date.now(); }
    drawKey = ""; tick();
  });
}

/* ── badge ────────────────────────────────────────────────────────────
   States the assumption permanently, so a mismatch with the scale XCTrack
   already shows is readable rather than silent.

   Goes red on the two things that make the display untrustworthy: the last
   fetch failed, or every visible reading is stale. Deliberately NOT driven
   by the single oldest station in the box — one distant instrument that
   stopped reporting is not a reason to alarm the whole widget, and
   per-marker staleness already shows in red numbers. ──────────────── */
function paintBadge(fix, shown, nStale){
  var b = document.getElementById("badge"), s, bad = false, off = false;
  if (!fix){
    s = "no position"; bad = true;
  } else {
    s = (WG.XCT_LADDER[curStep] || "?") + " N↑";
    if (curStep !== C.step){
      /* The map was NOT told. Amber, not red — red means the data is stale,
         and conflating the two would blunt both. */
      s += "  SET MAP  (tap badge to reset)";
      off = true;
    }
    if (!lastFetch){
      s += fetchErr ? ("  no data: " + fetchErr) : "  loading…";
      bad = !!fetchErr;
    } else {
      var fetchAge = Math.round((Date.now() - lastFetch) / 60000);
      s += "  " + shown;
      if (nStale) s += "  " + nStale + " stale";
      if (fetchErr){ s += "  OFFLINE " + fetchAge + "m"; bad = true; }
      else if (shown && nStale === shown){ s += "  ALL STALE"; bad = true; }
      else if (fetchAge >= Math.ceil(C.poll / 60) * 2){ s += "  " + fetchAge + "m"; bad = true; }
    }
  }
  if (b.firstChild){ if (b.firstChild.nodeValue !== s) b.firstChild.nodeValue = s; }
  else b.appendChild(document.createTextNode(s));
  var cls = bad ? "bad" : (off ? "off" : "");
  if (b.className !== cls) b.className = cls;
}

/* ── tick: poll at 2 Hz to match XCTrack's map redraw, but repaint only
   when something moved a whole pixel. At z11 a glider at 40 km/h moves
   0.21 px/s, so this is nearly free. ─────────────────────────────── */
function tick(){
  var p = WG.position(C), fix = p.fix;
  if (!fix){ draw(null, []); paintBadge(null, 0, 0); return; }

  if (!lastFetch || Date.now() - lastFetch > C.poll * 1000) refresh(fix);

  var now = Date.now();
  var ranked = WG.prepare(stations, fix, C, now), i, nStale = 0;
  for (i = 0; i < ranked.length; i++) if (ranked[i].stale.cls === "stale") nStale++;

  var z = WG.zoomForStep(curStep);
  var key = Math.round(WG.lonToPx(fix.lon, z) * WG.CAL) + "/" +
            Math.round(WG.latToPx(fix.lat, z) * WG.CAL) + "/" +
            W + "x" + H + "/" + curStep + "/" + lastFetch + "/" + Math.round(now / 60000);
  if (key !== drawKey){ drawKey = key; lastShown = draw(fix, ranked); }

  paintBadge(fix, lastShown, nStale);
}

/* ── optional tap zones ───────────────────────────────────────────────
   Off by default, and that default matters: with tapping enabled the WebView
   swallows every touch over its area, so any zone here takes one away from
   XCTrack. Measured 2026-08-11 — a tap never reaches both. See findings.md.

   For this to be useful the pilot must move XCTrack's own zoom buttons
   OUTSIDE the widget rectangle, then re-zoom the map by hand to match. The
   widget cannot verify that happened, so it says SET MAP until reset and the
   scale bar is there to be compared against XCTrack's. ─────────────── */
function stepBy(d){
  var n = curStep + d;
  if (n < WG.XCT_STEP_MIN || n > WG.XCT_STEP_MAX) return;
  curStep = n;
  drawKey = ""; lastFetch = 0;              /* the box moved with the zoom */
  tick();
}
if (C.ztap){
  var zi = document.getElementById("zin"), zo = document.getElementById("zout");
  zi.hidden = zo.hidden = false;
  zi.addEventListener("click", function(){ stepBy(+1); });   /* finer */
  zo.addEventListener("click", function(){ stepBy(-1); });   /* coarser */
  document.getElementById("badge").addEventListener("click", function(ev){
    ev.stopPropagation();
    curStep = C.step; drawKey = ""; lastFetch = 0; tick();
  });
}

resize();
tick();
setInterval(tick, 500);
</script>
</body>
</html>
